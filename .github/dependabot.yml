version: 2
updates:
  # GitHub Actions — grouped into a single PR, monthly, to keep single-maintainer load low.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"

  # The composite action under .github/actions pins a SHA of its own, and the entry above reads only
  # the workflows.
  - package-ecosystem: github-actions
    directory: /.github/actions/base-red-round
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"

  # The same for the maintenance branch, which runs these workflows and pins the same SHAs; the
  # entry above does not reach it, and `target-branch` is what names it. Actions only: what a
  # maintenance line takes from here is the pins its own workflows resolve, and anything else it
  # needs arrives as a backport.
  - package-ecosystem: github-actions
    directory: /
    target-branch: "2.x"
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"

  # Roslyn source-generator solution (standalone .NET project) — one grouped PR, monthly.
  - package-ecosystem: nuget
    directory: /Packages/com.velvet.core/Generators~
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
    groups:
      nuget:
        patterns:
          - "*"
    ignore:
      # Roslyn (Microsoft.CodeAnalysis.*) is pinned to match Unity's bundled compiler;
      # bumping it makes the shipped analyzer DLLs fail to load in the editor. Update manually.
      - dependency-name: "Microsoft.CodeAnalysis.*"
