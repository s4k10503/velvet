name: Milestone

# Runs the Milestone job of Source generators again when what it decides from changes without a push:
# a pull request's milestone or base, or a milestone of the repository opening, closing, going or
# being retitled. That job alone is asked to run again, so a milestone change re-runs no suite, and a
# run still going is left alone; scripts/pr/milestone.py owns which run and job are asked and says
# what a run left alone means, and CONTRIBUTING.md's merging section the rule the job holds.
#
# No job checks out the pull request: the only code this runs is the default branch's, as in
# automerge.yml.
on:
  pull_request_target:
    types: [milestoned, demilestoned, edited]
  milestone:
    types: [created, opened, closed, edited, deleted]

permissions: {}

# One run per pull request at a time, so two events at once do not both ask for the same re-run.
concurrency:
  group: milestone-${{ github.event.pull_request.number || 'repository' }}
  cancel-in-progress: false

# Same reason test.yml gives.
env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  rerun:
    name: Run the milestone check again
    # A pull request's edit is read only where it moved the base, and a milestone's only where it
    # retitled it: the rest change nothing decided.
    if: >-
      github.event.action != 'edited'
      || (github.event_name == 'pull_request_target' && github.event.changes.base != null)
      || (github.event_name == 'milestone' && github.event.changes.title != null)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -n "$NUMBER" ]; then
            python3 scripts/pr/milestone.py rerun --number "$NUMBER"
          else
            python3 scripts/pr/milestone.py rerun --open
          fi
