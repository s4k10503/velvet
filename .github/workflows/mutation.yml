name: Mutation campaign

# The mutation campaign: nightly over what the default branch gained since the last reported night,
# and over a branch's change when dispatched onto it. No pull request waits on either, and no
# branch-protection rule requires a check of this workflow. CONTRIBUTING.md ▸ Checking that the tests
# can fail owns what a night measures, how it reports, and what a dispatch is for.
#
# A dispatch's checkout is the branch's head rather than a test merge, so change_base.py reads the
# change against the merge base of that head and `base`. A night's base is the one
# mutation_nightly.py chose in the plan job, which change_base.py reads back in every job.
on:
  schedule:
    # 03:17 UTC, a minute picked off the hour.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      base:
        description: "The branch whose merge base with the dispatched branch the change is read against"
        required: true
        default: main

# A newer dispatch onto a branch cancels the campaign still measuring its older head; a running night
# is cancelled by neither another night nor a dispatch. Not test.yml's group, so no run of Test cancels a campaign.
concurrency:
  group: mutation-campaign-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

permissions:
  contents: read

# Same reason test.yml gives.
env:
  PYTHONDONTWRITEBYTECODE: "1"

# Timeouts sized as test.yml's are, but for the shard jobs', which ShardCeilingTests holds against the
# plan's ceiling.
jobs:
  # Same reading as test.yml's job of this name.
  license-check:
    name: Check Unity license secret
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      has_license: ${{ steps.check.outputs.has_license }}
    steps:
      - id: check
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -n "$UNITY_LICENSE" ]; then
            echo "has_license=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_license=false" >> "$GITHUB_OUTPUT"
            echo "::notice::UNITY_LICENSE secret is not set — the campaign measures nothing."
          fi

  # ---------------------------------------------------------------------------
  # The campaign decides as a local run over the same diff does, except that it measures every mutant
  # where a local run stops at --max, and passes a change no operator reaches where a local run refuses
  # one; CONTRIBUTING.md owns what it asks and what fails it.
  #
  # Two passes, because a mutant is killed when either suite fails on it and the two suites hold
  # different tests. Every mutant runs against the EditMode suite; only the EditMode survivors run
  # against the PlayMode suite, the slower of the two per mutant. Both passes run in one job per shard:
  # the plan counts the mutants, each shard measures the mutants dealt to it by expected cost against
  # EditMode and then, in the same job on the same runner, the survivors among them against PlayMode,
  # and records their verdicts. The PlayMode pass starts as its own shard's EditMode pass ends and adds
  # no job, which matters while an account's concurrent jobs are few. The verdict job reads both passes'
  # records and decides. The decision cannot be a shard's own, since a declaration above one line
  # answers for survivors another shard may have measured.
  #
  # A shard cannot run through game-ci/unity-test-runner, which launches one editor per step. It runs
  # mutation_check.py inside the image that action pulls for test.yml's unity-tests, and
  # ci_mutation_shard.py activates and returns the licence around it.
  # ---------------------------------------------------------------------------
  mutation-plan:
    name: Mutation campaign (plan)
    needs: license-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # actions: read, for the earlier campaigns the reuse step lists.
    permissions:
      contents: read
      actions: read
    outputs:
      mutants: ${{ steps.plan.outputs.mutants }}
      # Empty where a verdict is reused, which is what skips every job that measures.
      shards: ${{ steps.reuse.outputs.reused == '' && steps.plan.outputs.shards || '[]' }}
      key: ${{ steps.key.outputs.campaign-key }}
      reused: ${{ steps.reuse.outputs.reused }}
      # How many mutants an earlier campaign's kill answers for. Empty where the plan decided no reuse.
      reusing: ${{ steps.plan.outputs.reusing }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The per-mutant ledgers of the branch's earlier campaigns, failed ones included. A fetch that
      # fails leaves the directory short, and the plan then measures what it cannot find a kill for.
      - if: needs.license-check.outputs.has_license == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/reuse_verdict.py --ledgers Logs/mutation-ledgers

      # A night's window, read with the ledgers the plan reads so that the slice it chooses is one the
      # plan below lets through.
      - if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/mutation_nightly.py window --output window.json --reuse-from Logs/mutation-ledgers

      - id: base
        env:
          MUTATION_WINDOW: window.json
        run: python3 scripts/ci/change_base.py >> "$GITHUB_OUTPUT"

      # The summary is written before the status is read, and carries stderr, where a refusal other
      # than the ceiling's is printed, so a refused plan names why in it. Over the ceiling with no
      # licence no shard would run, so it passes the way the skipped Unity jobs do.
      - id: plan
        env:
          BASE: ${{ steps.base.outputs.sha }}
          HAS_LICENSE: ${{ needs.license-check.outputs.has_license }}
        run: |
          set +e
          python3 scripts/test_quality/mutation_check.py --base "$BASE" --plan --emit-mutants mutants.json \
            --reuse-from Logs/mutation-ledgers --emit-reuse reuse.json > plan.txt 2>&1
          status=$?
          cat plan.txt
          { echo '### Mutation campaign plan'; echo '```'; cat plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -eq 4 ] && [ "$HAS_LICENSE" != true ]; then
            echo 'shards=[]' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ "$status" -eq 0 ] || exit "$status"
          grep -E '^(mutants|shards|reusing)=' plan.txt >> "$GITHUB_OUTPUT"

      # The list every shard and the verdict job hands back to mutation_check.py, which refuses a tree
      # that generates another, the kills the plan reused, which each of them measures around, and on
      # a night the window, which their change_base.py reads the base from.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: >-
          (steps.plan.outputs.shards != '[]' || (steps.plan.outputs.reusing || '0') != '0')
          && needs.license-check.outputs.has_license == 'true'
        with:
          name: Mutation mutant list
          path: |
            mutants.json
            reuse.json
            window.json
          overwrite: true

      # For the report, which runs whether or not anything was measured.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'schedule' && needs.license-check.outputs.has_license == 'true'
        with:
          name: Mutation nightly window
          path: window.json
          overwrite: true

      # What the head asks of the campaign, as one hash. CONTRIBUTING.md owns what goes into it.
      - id: key
        if: >-
          (steps.plan.outputs.shards != '[]' || (steps.plan.outputs.reusing || '0') != '0')
          && needs.license-check.outputs.has_license == 'true'
        env:
          BASE: ${{ steps.base.outputs.sha }}
        run: |
          python3 scripts/test_quality/mutation_check.py --base "$BASE" --key | tee key.txt
          { echo '### Mutation campaign key'; echo '```'; cat key.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          grep -E '^campaign-key=' key.txt >> "$GITHUB_OUTPUT"

      # An earlier passing campaign on this branch that measured the same key. A lookup that fails
      # reuses nothing, and the campaign then measures.
      - id: reuse
        if: steps.key.outputs.campaign-key != ''
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ steps.key.outputs.campaign-key }}
        run: python3 scripts/ci/reuse_verdict.py --key "$KEY" | tee -a "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # The Library every EditMode shard restores. Test's unity-tests jobs save theirs under a pull
  # request's own ref, which is not this run's, so this restores what the branch and the default branch
  # hold, imports the head once where no entry carries its exact key, and saves the result under that
  # key for the shards and for the next campaign on the branch.
  # ---------------------------------------------------------------------------
  library:
    name: Mutation campaign (Library)
    needs: [license-check, mutation-plan]
    if: needs.license-check.outputs.has_license == 'true' && needs.mutation-plan.outputs.shards != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Library
          key: Library-EditMode-${{ hashFiles('Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-EditMode-

      # The EditMode shard's launch, with the editor opening the project and quitting.
      - if: steps.restore.outputs.cache-hit != 'true'
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          version=$(sed -n 's/^m_EditorVersion: //p' ProjectSettings/ProjectVersion.txt)
          docker run --rm --init --workdir /github/workspace \
            --volume "$GITHUB_WORKSPACE:/github/workspace" \
            --env UNITY_LICENSE --env UNITY_EMAIL --env UNITY_PASSWORD \
            --env PYTHONDONTWRITEBYTECODE=1 \
            "unityci/editor:ubuntu-$version-linux-il2cpp-3" \
            python3 -u scripts/ci/licensed_editor.py -- -projectPath /github/workspace

      - if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Library
          key: Library-EditMode-${{ hashFiles('Packages/**', 'ProjectSettings/**') }}

  mutation-shard:
    name: Mutation campaign (EditMode shard ${{ matrix.shard }})
    needs: [license-check, mutation-plan, library]
    if: needs.license-check.outputs.has_license == 'true' && needs.mutation-plan.outputs.shards != '[]'
    runs-on: ubuntu-latest
    # The two measuring steps' timeouts and the checkout, restore and upload around them; ShardCeilingTests
    # holds each step's timeout against its platform's ceiling.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.mutation-plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          lfs: true

      # Restore only: a campaign leaves Library compiled from its last mutant, which is not the tree
      # the key names.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Library
          key: Library-EditMode-${{ hashFiles('Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-EditMode-

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Mutation mutant list
          path: Logs/mutation-list

      - id: base
        env:
          MUTATION_WINDOW: Logs/mutation-list/window.json
        run: python3 scripts/ci/change_base.py >> "$GITHUB_OUTPUT"

      - name: Measure EditMode
        timeout-minutes: 180
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          BASE: ${{ steps.base.outputs.sha }}
          MUTANTS: ${{ needs.mutation-plan.outputs.mutants }}
          SHARDS: ${{ needs.mutation-plan.outputs.shards }}
        # safe.directory names the workspace alone: DocumentationDriftTests arranges checkouts elsewhere
        # that git has to refuse, and a wider value lifts that refusal inside the suite. The editor's
        # version is read from the project, and EditorVersionTests holds unity-tests' to the same.
        run: |
          version=$(sed -n 's/^m_EditorVersion: //p' ProjectSettings/ProjectVersion.txt)
          docker run --rm --init --workdir /github/workspace \
            --volume "$GITHUB_WORKSPACE:/github/workspace" \
            --env UNITY_LICENSE --env UNITY_EMAIL --env UNITY_PASSWORD \
            --env GIT_CONFIG_COUNT=1 --env GIT_CONFIG_KEY_0=safe.directory --env GIT_CONFIG_VALUE_0=/github/workspace \
            --env PYTHONDONTWRITEBYTECODE=1 \
            "unityci/editor:ubuntu-$version-linux-il2cpp-3" \
            python3 -u scripts/test_quality/ci_mutation_shard.py -- \
              --base "$BASE" --max "$MUTANTS" --mutants Logs/mutation-list/mutants.json \
              --reuse Logs/mutation-list/reuse.json \
              --shard "${{ matrix.shard }}/$(echo "$SHARDS" | jq length)" \
              --output Logs/mutation-shard

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: Mutation EditMode shard ${{ matrix.shard }}
          path: Logs/mutation-shard
          # A re-run of the failed shards replaces what the first attempt left.
          overwrite: true

      # How many of this shard's own mutants the EditMode pass left surviving. Run where the EditMode step
      # passed, so a shard that failed its pass runs no PlayMode pass, and the verdict job names it. More
      # than one job can measure after its own EditMode pass fails here, with the EditMode records already
      # uploaded.
      - id: survivors
        env:
          BASE: ${{ steps.base.outputs.sha }}
          MUTANTS: ${{ needs.mutation-plan.outputs.mutants }}
          SHARDS: ${{ needs.mutation-plan.outputs.shards }}
        run: |
          set +e
          python3 scripts/test_quality/mutation_check.py --base "$BASE" --max "$MUTANTS" --plan \
            --mutants Logs/mutation-list/mutants.json --reuse Logs/mutation-list/reuse.json \
            --platform PlayMode --survivors-of Logs/mutation-shard \
            --survivors-shard "${{ matrix.shard }}/$(echo "$SHARDS" | jq length)" > survivors.txt 2>&1
          status=$?
          cat survivors.txt
          [ "$status" -eq 0 ] || exit "$status"
          grep -E '^mutants=' survivors.txt >> "$GITHUB_OUTPUT"

      # The same launch as the EditMode step, on the runner and Library that step left.
      - name: Measure PlayMode
        timeout-minutes: 165
        if: steps.survivors.outputs.mutants != '' && steps.survivors.outputs.mutants != '0'
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          BASE: ${{ steps.base.outputs.sha }}
          MUTANTS: ${{ needs.mutation-plan.outputs.mutants }}
          SHARDS: ${{ needs.mutation-plan.outputs.shards }}
        run: |
          version=$(sed -n 's/^m_EditorVersion: //p' ProjectSettings/ProjectVersion.txt)
          docker run --rm --init --workdir /github/workspace \
            --volume "$GITHUB_WORKSPACE:/github/workspace" \
            --env UNITY_LICENSE --env UNITY_EMAIL --env UNITY_PASSWORD \
            --env GIT_CONFIG_COUNT=1 --env GIT_CONFIG_KEY_0=safe.directory --env GIT_CONFIG_VALUE_0=/github/workspace \
            --env PYTHONDONTWRITEBYTECODE=1 \
            "unityci/editor:ubuntu-$version-linux-il2cpp-3" \
            python3 -u scripts/test_quality/ci_mutation_shard.py -- \
              --base "$BASE" --max "$MUTANTS" --mutants Logs/mutation-list/mutants.json \
              --reuse Logs/mutation-list/reuse.json --platform PlayMode --survivors-of Logs/mutation-shard \
              --survivors-shard "${{ matrix.shard }}/$(echo "$SHARDS" | jq length)" --shard 0/1 \
              --output Logs/mutation-playmode-shard

      # Uploaded whether or not the shard had survivors, so the verdict job's pattern always matches one.
      # The docker steps run as root and leave Logs/mutation-playmode-shard owned by it, which the runner
      # user cannot write a file into: the directory is handed back first.
      - if: always()
        run: |
          sudo chown -R "$(id -u):$(id -g)" Logs
          mkdir -p Logs/mutation-playmode-shard
          echo "shard ${{ matrix.shard }}" > Logs/mutation-playmode-shard/shard-${{ matrix.shard }}.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: Mutation PlayMode shard ${{ matrix.shard }}
          path: Logs/mutation-playmode-shard
          overwrite: true

  mutation-verdict:
    name: Mutation campaign (verdict)
    needs: [license-check, mutation-plan, mutation-shard]
    if: >-
      !cancelled() && needs.license-check.outputs.has_license == 'true'
      && needs.mutation-plan.result == 'success'
      && (needs.mutation-plan.outputs.shards != '[]' || needs.mutation-plan.outputs.reused != ''
          || (needs.mutation-plan.outputs.reusing || '0') != '0')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The head's key is a key a campaign already passed on: no mutant is measured here, and the run
      # cited is the one that measured it. scripts/pr/settle.py reads that citation before a merge.
      - if: needs.mutation-plan.outputs.reused != ''
        env:
          REUSED: ${{ needs.mutation-plan.outputs.reused }}
          KEY: ${{ needs.mutation-plan.outputs.key }}
        run: |
          { echo '### Mutation campaign'; echo "Verdict reused from run $REUSED: its head asked the same mutants of the same code, tests and tool (key $KEY). No mutant was measured in this run."; } | tee -a "$GITHUB_STEP_SUMMARY"

      - if: needs.mutation-plan.outputs.reused == ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Mutation mutant list
          path: Logs/mutation-list

      # Only where a shard ran: a campaign whose every mutant was reused has no shard artifact for a
      # pattern to match, and what the action does with a pattern that matches nothing is not relied on.
      - if: needs.mutation-plan.outputs.reused == '' && needs.mutation-shard.result != 'skipped'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: Mutation EditMode shard *
          path: Logs/mutation-shards
          merge-multiple: true

      - if: needs.mutation-plan.outputs.reused == '' && needs.mutation-shard.result != 'skipped'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: Mutation PlayMode shard *
          path: Logs/mutation-playmode-shards
          merge-multiple: true

      - id: base
        if: needs.mutation-plan.outputs.reused == ''
        env:
          MUTATION_WINDOW: Logs/mutation-list/window.json
        run: python3 scripts/ci/change_base.py >> "$GITHUB_OUTPUT"

      # A mutant the plan reused a kill for keeps it, once its killing cases are found unchanged in
      # this tree. A mutant the EditMode pass killed keeps that verdict; one it left surviving takes the
      # PlayMode pass's, and a survivor no PlayMode shard recorded is unmeasured.
      - if: needs.mutation-plan.outputs.reused == ''
        env:
          BASE: ${{ steps.base.outputs.sha }}
          MUTANTS: ${{ needs.mutation-plan.outputs.mutants }}
        run: |
          set +e
          python3 scripts/test_quality/mutation_check.py --base "$BASE" --max "$MUTANTS" \
            --mutants Logs/mutation-list/mutants.json --reuse Logs/mutation-list/reuse.json \
            --platform PlayMode --survivors-of Logs/mutation-shards \
            --collect Logs/mutation-playmode-shards --output Logs/mutation-verdict \
            --emit-ledger Logs/mutation-ledger/ledger.json | tee verdict.txt
          status=${PIPESTATUS[0]}
          { echo '### Mutation campaign'; echo '```'; cat verdict.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # What a night's report reads its survivors from, uploaded whether the decision passed or failed.
      - if: ${{ !cancelled() && hashFiles('verdict.txt') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Mutation campaign verdict
          path: verdict.txt
          overwrite: true

      # Uploaded whether the decision passed or failed: a campaign that failed on a survivor is the one
      # whose kills the next round reuses. What a ledger holds is checked against the tree that reads it.
      - if: ${{ !cancelled() && needs.mutation-plan.outputs.reused == '' && hashFiles('Logs/mutation-ledger/ledger.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Mutation campaign ledger
          path: Logs/mutation-ledger/ledger.json
          overwrite: true

      # Recorded only once the steps above passed, so a key names a campaign that passed. A run that
      # reused one cites the run that measured it, not the one it read the key from.
      - id: recorded
        env:
          KEY: ${{ needs.mutation-plan.outputs.key }}
          REUSED: ${{ needs.mutation-plan.outputs.reused }}
        run: |
          if [ -n "$REUSED" ]; then
            python3 scripts/ci/reuse_verdict.py --name "$KEY" --from "$REUSED" >> "$GITHUB_OUTPUT"
          else
            python3 scripts/ci/reuse_verdict.py --name "$KEY" >> "$GITHUB_OUTPUT"
          fi
          echo "$KEY" > campaign-key.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.recorded.outputs.name }}
          path: campaign-key.txt
          overwrite: true

  # ---------------------------------------------------------------------------
  # A night's report: what the verdict left to answer, what the window left unmeasured and any job
  # that did not pass, as a comment on the tracking issue (scripts/ci/mutation_nightly.py). always(),
  # so a night whose plan or shards failed still says so. The marker it uploads last is where the next
  # night's window starts, so a night whose report was not written is measured again by the next.
  # ---------------------------------------------------------------------------
  report:
    name: Mutation campaign (nightly report)
    if: always() && github.event_name == 'schedule' && needs.license-check.outputs.has_license == 'true'
    needs: [license-check, mutation-plan, library, mutation-shard, mutation-verdict]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Either can be absent: a plan that failed wrote no window, and a verdict job that did not run
      # wrote no verdict. The report names both absences.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: Mutation nightly window
          path: Logs/mutation-window

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: Mutation campaign verdict
          path: Logs/mutation-verdict

      - id: report
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTS: >-
            license-check=${{ needs.license-check.result }} mutation-plan=${{ needs.mutation-plan.result }}
            library=${{ needs.library.result }} mutation-shard=${{ needs.mutation-shard.result }}
            mutation-verdict=${{ needs.mutation-verdict.result }}
          REUSED: ${{ needs.mutation-plan.outputs.reused }}
        run: |
          set -o pipefail
          python3 scripts/ci/mutation_nightly.py report --window Logs/mutation-window/window.json \
            --verdict Logs/mutation-verdict/verdict.txt | tee report.txt
          { echo '### Mutation campaign report'; echo '```'; cat report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          grep -E '^head=[0-9a-f]{40}$' report.txt >> "$GITHUB_OUTPUT" || true

      - if: steps.report.outputs.head != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Mutation nightly reported ${{ steps.report.outputs.head }}
