name: Mutation campaign

# The mutation campaign, in the shape cargo-mutants and StrykerJS run theirs: every run, nightly, on a
# push to the default branch or on a dispatch with no `base`, measures the mutants of the campaign's
# scope that the record does not answer yet and writes what it measured into the record; a dispatch
# with a `base` measures the change since the merge base with it and writes the record the same way.
# No pull request runs it,
# and no branch-protection rule requires a check of this workflow. CONTRIBUTING.md ▸ Checking that the
# tests can fail owns the scope, the record, the cap and the catch-up, and the release gate that reads
# the record.
on:
  push:
    branches: [main]
  schedule:
    # 03:17 UTC, a minute picked off the hour.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      base:
        description: "Empty to measure the campaign's scope and write the record; a branch to measure the change since the merge base with it"
        required: false
        default: ""

# A run on a ref waits for the one in progress rather than cancelling it, so a run's measurement is
# never thrown away before its record is written; GitHub keeps only the newest of the waiting ones,
# which measures from the newest head. Not test.yml's group, so no run of Test cancels a campaign.
concurrency:
  group: mutation-record-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# PYTHONDONTWRITEBYTECODE for the reason test.yml gives. The cap is how many unanswered mutants one
# run deals at most, and the shard count what it splits them across; RecordBudgetTests holds the cap
# inside its shards' ceiling and a run's shard waves inside a day. EDITOR_MEMORY is what a shard's editor
# container may hold, memory and swap alike, and stays under the runner's own: a launch that outgrows
# it loses a process inside the container, which mutation_check.py records as a crash. RunnerLimitTests
# holds it under the runner's memory.
env:
  PYTHONDONTWRITEBYTECODE: "1"
  EDITOR_MEMORY: "12g"
  RECORD_CAP: "280"
  RECORD_SHARDS: "40"

# Timeouts sized as test.yml's are, but for the shard jobs', which ShardCeilingTests holds against the
# plan's ceiling.
jobs:
  # Same reading as test.yml's job of this name.
  license-check:
    name: Check Unity license secret
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      has_license: ${{ steps.check.outputs.has_license }}
    steps:
      - id: check
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -n "$UNITY_LICENSE" ]; then
            echo "has_license=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_license=false" >> "$GITHUB_OUTPUT"
            echo "::notice::UNITY_LICENSE secret is not set — the campaign measures nothing."
          fi

  # ---------------------------------------------------------------------------
  # The campaign decides as a local run over the same diff does, except that it measures every mutant
  # the record does not answer, up to the cap, where a local run stops at --max, and passes a change no
  # operator reaches where a local run refuses one; CONTRIBUTING.md owns what it asks and what fails it.
  #
  # Two passes, because a mutant is killed when either suite fails on it and the two suites hold
  # different tests. Every mutant runs against the EditMode suite; only the EditMode survivors run
  # against the PlayMode suite, the slower of the two per mutant. Both passes run in one job per shard:
  # the plan counts the mutants, each shard measures the mutants dealt to it by expected cost against
  # EditMode and then, in the same job on the same runner, the survivors among them against PlayMode,
  # and records their verdicts. The PlayMode pass starts as its own shard's EditMode pass ends and adds
  # no job, which matters while an account's concurrent jobs are few. The verdict job reads both passes'
  # records and decides. The decision cannot be a shard's own, since a declaration above one line
  # answers for survivors another shard may have measured.
  #
  # A shard cannot run through game-ci/unity-test-runner, which launches one editor per step. It runs
  # mutation_check.py inside the image that action pulls for test.yml's unity-tests, and
  # ci_mutation_shard.py activates and returns the licence around it.
  # ---------------------------------------------------------------------------
  mutation-plan:
    name: Mutation campaign (plan)
    needs: license-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mutants: ${{ steps.plan.outputs.mutants }}
      shards: ${{ steps.plan.outputs.shards }}
      max-shards: ${{ steps.plan.outputs.max-shards }}
      # How many mutants the record answers for, and how many the cap left to a later run.
      reusing: ${{ steps.plan.outputs.reusing }}
      pending: ${{ steps.plan.outputs.pending }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Empty where the branch does not exist yet, and every mutant is then unanswered. Refused where
      # the branch holds a commit its writer did not make.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/mutation_record.py fetch Logs/mutation-record

      - id: base
        env:
          MUTATION_SCOPE: "1"
        run: python3 scripts/ci/change_base.py >> "$GITHUB_OUTPUT"

      # The summary is written before the status is read, and carries stderr, where a refusal other
      # than the ceiling's is printed, so a refused plan names why in it. Over the ceiling with no
      # licence no shard would run, so it passes the way the skipped Unity jobs do.
      - id: plan
        env:
          BASE: ${{ steps.base.outputs.sha }}
          HAS_LICENSE: ${{ needs.license-check.outputs.has_license }}
          CAP: ${{ env.RECORD_CAP }}
          MAX_SHARDS: ${{ env.RECORD_SHARDS }}
        run: |
          set +e
          python3 scripts/test_quality/mutation_check.py --base "$BASE" --plan --emit-mutants mutants.json \
            --max-shards "$MAX_SHARDS" --cap "$CAP" \
            --reuse-from Logs/mutation-record --emit-reuse reuse.json > plan.txt 2>&1
          status=$?
          cat plan.txt
          { echo '### Mutation campaign plan'; echo '```'; cat plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "max-shards=$MAX_SHARDS" >> "$GITHUB_OUTPUT"
          if [ "$status" -eq 4 ] && [ "$HAS_LICENSE" != true ]; then
            echo 'shards=[]' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ "$status" -eq 0 ] || exit "$status"
          grep -E '^(mutants|shards|reusing|pending)=' plan.txt >> "$GITHUB_OUTPUT"

      # The list every shard and the verdict job hands back to mutation_check.py, which refuses a tree
      # that generates another, and the plan's decision of what the record answers and what the cap
      # leaves, which each of them measures around.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: >-
          (steps.plan.outputs.shards != '[]' || (steps.plan.outputs.reusing || '0') != '0')
          && needs.license-check.outputs.has_license == 'true'
        with:
          name: Mutation mutant list
          path: |
            mutants.json
            reuse.json
          overwrite: true

  # ---------------------------------------------------------------------------
  # The Library every EditMode shard restores. Test's unity-tests jobs save theirs under a pull
  # request's own ref, which is not this run's, so this restores what the ref and the default branch
  # hold, imports the head once where no entry carries its exact key, and saves the result under that
  # key for the shards and for the next campaign on the ref.
  # ---------------------------------------------------------------------------
  library:
    name: Mutation campaign (Library)
    needs: [license-check, mutation-plan]
    if: needs.license-check.outputs.has_license == 'true' && needs.mutation-plan.outputs.shards != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Library
          key: Library-EditMode-${{ hashFiles('Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-EditMode-

      # The EditMode shard's launch, with the editor opening the project and quitting.
      - if: steps.restore.outputs.cache-hit != 'true'
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          version=$(sed -n 's/^m_EditorVersion: //p' ProjectSettings/ProjectVersion.txt)
          docker run --rm --init --workdir /github/workspace \
            --volume "$GITHUB_WORKSPACE:/github/workspace" \
            --env UNITY_LICENSE --env UNITY_EMAIL --env UNITY_PASSWORD \
            --env PYTHONDONTWRITEBYTECODE=1 \
            "unityci/editor:ubuntu-$version-linux-il2cpp-3" \
            python3 -u scripts/ci/licensed_editor.py -- -projectPath /github/workspace

      - if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Library
          key: Library-EditMode-${{ hashFiles('Packages/**', 'ProjectSettings/**') }}

  mutation-shard:
    name: Mutation campaign (EditMode shard ${{ matrix.shard }})
    needs: [license-check, mutation-plan, library]
    if: needs.license-check.outputs.has_license == 'true' && needs.mutation-plan.outputs.shards != '[]'
    runs-on: ubuntu-latest
    # The two measuring steps' timeouts and the checkout, restore and upload around them; ShardCeilingTests
    # holds each step's timeout against its platform's ceiling.
    timeout-minutes: 360
    # Ten at once whatever the run's shard count; RecordBudgetTests sizes RECORD_SHARDS against this.
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        shard: ${{ fromJSON(needs.mutation-plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          lfs: true

      # Restore only: a campaign leaves Library compiled from its last mutant, which is not the tree
      # the key names.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Library
          key: Library-EditMode-${{ hashFiles('Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-EditMode-

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Mutation mutant list
          path: Logs/mutation-list

      - id: base
        env:
          MUTATION_SCOPE: "1"
        run: python3 scripts/ci/change_base.py >> "$GITHUB_OUTPUT"

      # The campaign is given a time budget that ends before this step's timeout. A mutant whose launches,
      # at their bounds, do not fit what is left is recorded unmeasured and not started, so the step
      # passes with the mutants it reached and the next run measures the rest. ShardCeilingTests holds the
      # budget inside the timeout.
      - name: Measure EditMode
        timeout-minutes: 180
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          BASE: ${{ steps.base.outputs.sha }}
          MUTANTS: ${{ needs.mutation-plan.outputs.mutants }}
          SHARDS: ${{ needs.mutation-plan.outputs.shards }}
        # safe.directory names the workspace alone: DocumentationDriftTests arranges checkouts elsewhere
        # that git has to refuse, and a wider value lifts that refusal inside the suite. The editor's
        # version is read from the project, and EditorVersionTests holds unity-tests' to the same.
        run: |
          version=$(sed -n 's/^m_EditorVersion: //p' ProjectSettings/ProjectVersion.txt)
          docker run --rm --init --workdir /github/workspace \
            --memory "$EDITOR_MEMORY" --memory-swap "$EDITOR_MEMORY" --pids-limit 4096 \
            --volume "$GITHUB_WORKSPACE:/github/workspace" \
            --env UNITY_LICENSE --env UNITY_EMAIL --env UNITY_PASSWORD \
            --env GIT_CONFIG_COUNT=1 --env GIT_CONFIG_KEY_0=safe.directory --env GIT_CONFIG_VALUE_0=/github/workspace \
            --env PYTHONDONTWRITEBYTECODE=1 \
            "unityci/editor:ubuntu-$version-linux-il2cpp-3" \
            python3 -u scripts/test_quality/ci_mutation_shard.py -- \
              --base "$BASE" --max "$MUTANTS" --mutants Logs/mutation-list/mutants.json \
              --reuse Logs/mutation-list/reuse.json \
              --shard "${{ matrix.shard }}/$(echo "$SHARDS" | jq length)" \
              --budget 10200 \
              --output Logs/mutation-shard

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: Mutation EditMode shard ${{ matrix.shard }}
          path: Logs/mutation-shard
          # A re-run of the failed shards replaces what the first attempt left.
          overwrite: true

      # How many of this shard's own mutants the EditMode pass left surviving. Run where the EditMode step
      # passed, so a shard that failed its pass runs no PlayMode pass, and the verdict job names it. Survivors
      # past what one job measures on PlayMode are left unmeasured there and named by the verdict job.
      - id: survivors
        env:
          BASE: ${{ steps.base.outputs.sha }}
          MUTANTS: ${{ needs.mutation-plan.outputs.mutants }}
          SHARDS: ${{ needs.mutation-plan.outputs.shards }}
        run: |
          set +e
          python3 scripts/test_quality/mutation_check.py --base "$BASE" --max "$MUTANTS" --plan \
            --mutants Logs/mutation-list/mutants.json --reuse Logs/mutation-list/reuse.json \
            --platform PlayMode --survivors-of Logs/mutation-shard \
            --survivors-shard "${{ matrix.shard }}/$(echo "$SHARDS" | jq length)" > survivors.txt 2>&1
          status=$?
          cat survivors.txt
          [ "$status" -eq 0 ] || exit "$status"
          grep -E '^mutants=' survivors.txt >> "$GITHUB_OUTPUT"

      # The Library the EditMode step started from, put back. The PlayMode baseline over the Library
      # that step's last launch left failed to compile in five shards of three runs, on Mono.Cecil for
      # the CodeGen assembly or on package sources under Library/PackageCache; no EditMode baseline,
      # which starts from the restored Library, failed so.
      - if: steps.survivors.outputs.mutants != '' && steps.survivors.outputs.mutants != '0'
        run: sudo rm -rf Library

      - if: steps.survivors.outputs.mutants != '' && steps.survivors.outputs.mutants != '0'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Library
          key: Library-EditMode-${{ hashFiles('Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-EditMode-

      # The same launch as the EditMode step, on the runner and the Library restored above.
      - name: Measure PlayMode
        timeout-minutes: 165
        if: steps.survivors.outputs.mutants != '' && steps.survivors.outputs.mutants != '0'
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          BASE: ${{ steps.base.outputs.sha }}
          MUTANTS: ${{ needs.mutation-plan.outputs.mutants }}
          SHARDS: ${{ needs.mutation-plan.outputs.shards }}
        run: |
          version=$(sed -n 's/^m_EditorVersion: //p' ProjectSettings/ProjectVersion.txt)
          docker run --rm --init --workdir /github/workspace \
            --memory "$EDITOR_MEMORY" --memory-swap "$EDITOR_MEMORY" --pids-limit 4096 \
            --volume "$GITHUB_WORKSPACE:/github/workspace" \
            --env UNITY_LICENSE --env UNITY_EMAIL --env UNITY_PASSWORD \
            --env GIT_CONFIG_COUNT=1 --env GIT_CONFIG_KEY_0=safe.directory --env GIT_CONFIG_VALUE_0=/github/workspace \
            --env PYTHONDONTWRITEBYTECODE=1 \
            "unityci/editor:ubuntu-$version-linux-il2cpp-3" \
            python3 -u scripts/test_quality/ci_mutation_shard.py -- \
              --base "$BASE" --max "$MUTANTS" --mutants Logs/mutation-list/mutants.json \
              --reuse Logs/mutation-list/reuse.json --platform PlayMode --survivors-of Logs/mutation-shard \
              --survivors-shard "${{ matrix.shard }}/$(echo "$SHARDS" | jq length)" --shard 0/1 \
              --budget 9300 \
              --output Logs/mutation-playmode-shard

      # Uploaded whether or not the shard had survivors, so the verdict job's pattern always matches one.
      # The docker steps run as root and leave Logs/mutation-playmode-shard owned by it, which the runner
      # user cannot write a file into: the directory is handed back first.
      - if: always()
        run: |
          sudo chown -R "$(id -u):$(id -g)" Logs
          mkdir -p Logs/mutation-playmode-shard
          echo "shard ${{ matrix.shard }}" > Logs/mutation-playmode-shard/shard-${{ matrix.shard }}.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: Mutation PlayMode shard ${{ matrix.shard }}
          path: Logs/mutation-playmode-shard
          overwrite: true

  mutation-verdict:
    name: Mutation campaign (verdict)
    needs: [license-check, mutation-plan, mutation-shard]
    if: >-
      !cancelled() && needs.license-check.outputs.has_license == 'true'
      && needs.mutation-plan.result == 'success'
      && (needs.mutation-plan.outputs.shards != '[]' || (needs.mutation-plan.outputs.reusing || '0') != '0')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      # How many mutants the shards left unmeasured for want of time, which the record job reads.
      left: ${{ steps.decide.outputs.left }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Mutation mutant list
          path: Logs/mutation-list

      # Only where a shard ran: a run whose every mutant the record answered has no shard artifact for a
      # pattern to match, and what the action does with a pattern that matches nothing is not relied on.
      - if: needs.mutation-shard.result != 'skipped'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: Mutation EditMode shard *
          path: Logs/mutation-shards
          merge-multiple: true

      - if: needs.mutation-shard.result != 'skipped'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: Mutation PlayMode shard *
          path: Logs/mutation-playmode-shards
          merge-multiple: true

      - id: base
        env:
          MUTATION_SCOPE: "1"
        run: python3 scripts/ci/change_base.py >> "$GITHUB_OUTPUT"

      # A mutant the record answered keeps that verdict once it is found still standing in this tree. A
      # mutant the EditMode pass killed keeps that verdict; one it left surviving takes the PlayMode
      # pass's, and a survivor no PlayMode shard recorded is unmeasured. A mutant past the cap is left to
      # a later run and fails nothing here.
      - id: decide
        env:
          BASE: ${{ steps.base.outputs.sha }}
          MUTANTS: ${{ needs.mutation-plan.outputs.mutants }}
          MAX_SHARDS: ${{ needs.mutation-plan.outputs.max-shards }}
        run: |
          set +e
          python3 scripts/test_quality/mutation_check.py --base "$BASE" --max "$MUTANTS" --max-shards "$MAX_SHARDS" \
            --mutants Logs/mutation-list/mutants.json --reuse Logs/mutation-list/reuse.json \
            --platform PlayMode --survivors-of Logs/mutation-shards \
            --collect Logs/mutation-playmode-shards --output Logs/mutation-verdict \
            --emit-record Logs/mutation-record | tee verdict.txt
          status=${PIPESTATUS[0]}
          { echo '### Mutation campaign'; echo '```'; cat verdict.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "left=$(sed -n 's/.*not measured (budget): \([0-9][0-9]*\).*/\1/p' verdict.txt | head -n 1)" >> "$GITHUB_OUTPUT"
          exit "$status"

      # Both uploaded whether the decision passed or failed: a run that failed on a survivor still
      # measured every mutant it records, and the report reads its findings from the verdict.
      - if: ${{ !cancelled() && hashFiles('verdict.txt') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Mutation campaign verdict
          path: verdict.txt
          overwrite: true

      - if: ${{ !cancelled() && hashFiles('Logs/mutation-record/*.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Mutation campaign record entries
          path: Logs/mutation-record
          overwrite: true

  # ---------------------------------------------------------------------------
  # What the run measured goes onto the record branch (scripts/ci/mutation_record.py), as a commit this
  # job's token creates through the Git Data API, which is the only kind a reader of the branch trusts.
  # Where the cap or a shard's time budget left mutants to a later run, this run recorded something, and every shard passed, the run dispatches the next one onto the same ref,
  # which waits in the concurrency group for nothing but this run: the next measures the following
  # mutants in the same order, since the ones this run answered are now in the record. A run that
  # recorded nothing dispatches nothing, so a mutant no run can measure stops the chain rather than
  # being dealt to it forever.
  # ---------------------------------------------------------------------------
  record:
    name: Mutation campaign (record)
    needs: [license-check, mutation-plan, mutation-shard, mutation-verdict]
    if: >-
      !cancelled()
      && (needs.mutation-verdict.result == 'success' || needs.mutation-verdict.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Absent where the verdict recorded nothing, which publishes nothing.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: Mutation campaign record entries
          path: Logs/mutation-record

      - id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          mkdir -p Logs/mutation-record
          python3 scripts/ci/mutation_record.py publish Logs/mutation-record \
            --message "Record run $GITHUB_RUN_ID at $GITHUB_SHA" | tee published.txt
          echo "published=$(sed -n 's/^\([0-9]*\) record entries published$/\1/p' published.txt)" >> "$GITHUB_OUTPUT"

      - if: >-
          ((needs.mutation-plan.outputs.pending || '0') != '0' || (needs.mutation-verdict.outputs.left || '0') != '0')
          && (steps.publish.outputs.published || '0') != '0'
          && needs.mutation-shard.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_INPUT: ${{ inputs.base }}
        run: gh workflow run mutation.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" ${BASE_INPUT:+-f base="$BASE_INPUT"}

  # ---------------------------------------------------------------------------
  # What a run left to answer, uploaded to code scanning as SARIF (scripts/ci/mutation_report.py).
  # always(), so a run whose plan or shards failed still says so. Nothing decides on the alerts: the
  # release gate reads the record. The one job holding the code-scanning write permission.
  # ---------------------------------------------------------------------------
  report:
    name: Mutation campaign (report)
    if: always() && needs.license-check.outputs.has_license == 'true'
    needs: [license-check, mutation-plan, library, mutation-shard, mutation-verdict, record]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Absent where the verdict job did not run, which the report names.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: Mutation campaign verdict
          path: Logs/mutation-verdict

      - env:
          PENDING: ${{ needs.mutation-plan.outputs.pending }}
          RESULTS: >-
            license-check=${{ needs.license-check.result }} mutation-plan=${{ needs.mutation-plan.result }}
            library=${{ needs.library.result }} mutation-shard=${{ needs.mutation-shard.result }}
            mutation-verdict=${{ needs.mutation-verdict.result }} record=${{ needs.record.result }}
        run: |
          set -o pipefail
          python3 scripts/ci/mutation_report.py --verdict Logs/mutation-verdict/verdict.txt --sarif mutation.sarif | tee report.txt
          cat report.txt >> "$GITHUB_STEP_SUMMARY"

      # Not written where the verdict is absent: an upload with no results closes every alert.
      - if: ${{ hashFiles('mutation.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: mutation.sarif
          category: mutation-campaign
