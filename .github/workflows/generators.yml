name: Source generators

# The Roslyn generators are a standalone dotnet solution, but this job is triggered by the whole package
# rather than by Generators~ alone, because its drift guards read the package: they re-derive the hook
# surface and the test stub's signatures from the runtime sources, and CodeShapeOptInDriftTests enumerates
# every asmdef under the package to check it opts into the code-shape rules. Listing directories one by one
# is what let assemblies outside Runtime/ escape that guard: an asmdef added under Editor/, CodeGen/ or
# TestUtilities/ did trigger test.yml, but that workflow runs Unity — it never runs the dotnet suite the
# guard lives in, and it is skipped outright without a UNITY_LICENSE secret. So the guard is only ever
# reached from here, and its path set has to be the package rather than a list of its current directories.
#
# Generator changes reach the Unity side as committed DLLs under Runtime/Plugins, which the Unity test
# workflow picks up on its own paths; that workflow keeps excluding Generators~, so a generator-only change
# still runs here alone.
#
# setup.md is re-included after the blanket markdown exclusion because a guard here re-derives one of its
# claims from the bundled stylesheets, and the Unity workflow excludes Documentation~ outright: without
# this line a PR touching only that guide runs no suite at all, which is precisely when the claim drifts.
# The contributor README is re-included for the same reason — guards here read the diagnostic IDs, the
# failure-code range and the analyzer categories it names back against the code that defines them, and the
# Unity workflow excludes Generators~ outright.
# A re-include must stay after '!**.md' — the last matching pattern is the one that decides.
#
# The list is the push trigger's alone. pull_request and merge_group carry no path filter and must not
# gain one, and both triggers must stay present, for the reasons test.yml states over its own.
on:
  push:
    branches: [main]
    paths:
      - 'Packages/com.velvet.core/**'
      - '.github/workflows/generators.yml'
      # The jobs below run these, and a push editing one used to start only test.yml — whose Unity jobs
      # are skipped without a licence, so the ratchet that push was about executed nowhere.
      - 'scripts/**'
      - '!**.md'
      - 'Packages/com.velvet.core/Documentation~/setup.md'
      - 'Packages/com.velvet.core/Generators~/README.md'
      # AdditionalFiles on the generator projects, so Roslyn's release-tracking analyzer reads them at
      # compile time. The blanket markdown exclusion above reads them as documentation, and a push
      # editing either started no run at all.
      - 'Packages/com.velvet.core/Generators~/src/**/AnalyzerReleases.*.md'
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: generators-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Source-generator tests (.NET / xUnit). No Unity license required.
  # ---------------------------------------------------------------------------
  source-generators:
    name: Source generators (dotnet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET (pinned by Generators~/global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: Packages/com.velvet.core/Generators~/global.json

      - name: Test
        working-directory: Packages/com.velvet.core/Generators~
        run: dotnet test Velvet.SourceGenerators.sln -c Release --nologo

      # The step above tests the sources; Unity loads the committed DLLs beside them, and nothing else
      # in this repository compares the two. Generators~/Directory.Build.props owns what makes that
      # comparison possible.
      - name: Committed generator DLLs
        run: python3 scripts/generators/deployed_dll_check.py

      # A guard that exits 0 having compared nothing looks exactly like one that compared and was
      # satisfied. These drive the states where it would — an absent binary, a failing build, an SDK
      # other than the pin — which a run over a healthy checkout does not reach.
      - name: Committed generator DLL check tests
        run: python3 scripts/generators/test_deployed_dll_check.py

      - name: Cohesion report
        run: python3 scripts/test_quality/cohesion_report.py

      - name: Duplication ratchet
        run: python3 scripts/test_quality/duplication_check.py

      # The ratchet reports what its block set says, so the set is what has to be held: a swap that
      # leaves the total alone is invisible to the step above and is what this asserts.
      - name: Duplication ratchet tests
        run: python3 scripts/test_quality/test_duplication_check.py

      # The merge gate decides from plain data so its cases run without a network — a gate exercised
      # only against live pull requests is exercised only in the states those happen to be in.
      - name: Pull request settle tests
        run: python3 scripts/pr/test_settle.py

      # A PreToolUse guard whose repository reading failed exits 0, which is also what it exits with
      # nothing to report, so the difference is measured by running each guard with git or gh unable
      # to answer. Here rather than beside the EditMode fixtures that read the same directory:
      # test.yml's Unity jobs are skipped without a UNITY_LICENSE secret and its aggregate counts a
      # skip as a pass, so a guard silently not running is the very shape this checks for.
      - name: Hook unreadable-state tests
        run: python3 scripts/hooks/test_unreadable_state_check.py

      # The reading those Stop guards share, and what it says when no way of asking answered. Held
      # apart from the check above because that one runs whole guards and this one holds the library
      # they run through: a guard could satisfy the check by hand-rolling a report, and then only
      # one of the two would say it.
      - name: Hook repository-reading tests
        run: python3 scripts/hooks/test_hook_repository.py

      # Every guard over a merge, posed a pull request based on a branch that is not main. Until a
      # maintenance branch was cut, every case in this repository posed one based on main, and two
      # guards had been refusing everything else since they were written.
      - name: Pull-request base check
        run: python3 scripts/hooks/pull_request_base_check.py

      # A sweep that reports nothing looks the same whether the guards read the base or the directory
      # was empty, so these drive the states where it would report something.
      - name: Pull-request base check tests
        run: python3 scripts/hooks/test_pull_request_base_check.py

      # The reading both merge guards take their base through. The sweep above exercises its numbered
      # half through the guards themselves; the other shape is posed here, and that file says why the
      # sweep cannot hold it.
      - name: Merge target reading tests
        run: python3 scripts/hooks/test_merge_target.py

      # The session-start report shares that reading, and what it prints is a rebase command — so the
      # branch it names is an instruction rather than a number.
      - name: Stale base report tests
        run: python3 scripts/hooks/test_stale_main.py

      # Holds the body guards' record of which gh options take a value against the gh on the runner,
      # which needs no licence and no token, only `--help`. The script owns what a disagreement
      # costs in either direction.
      - name: Pull-request body option-table tests
        run: python3 scripts/hooks/test_pr_body_flags.py

      # Both guards decide from something the licence-free half can build: one from a pair of
      # repositories git makes here, the other from the text of an edit. Neither needs the editor,
      # and the amend guard's cases are the only place the two commands that answer its question are
      # held to each other.
      - name: Amend guard tests
        run: python3 scripts/hooks/test_amend_of_published_commit.py

      - name: Declaration first-line tests
        run: python3 scripts/hooks/test_declaration_first_line_fragment.py

      - name: Hand-rolled poller guard tests
        run: python3 scripts/hooks/test_hand_rolled_pr_poller.py

  # ---------------------------------------------------------------------------
  # Repository settings live only in GitHub's own state; nothing in this
  # repository reads them back. contents:read is enough for the rulesets
  # endpoints on the canonical repository — measured here with GITHUB_TOKEN at
  # that permission, both list and get answering HTTP 200. A fork's token cannot
  # read the upstream ruleset, and the check names are upstream's, so the job
  # skips when github.repository is not s4k10503/velvet.
  # ---------------------------------------------------------------------------
  repository-settings:
    name: Repository settings
    if: github.repository == 's4k10503/velvet'
    runs-on: ubuntu-latest
    steps:
      - name: Assert repository settings
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          failed=0
          unverifiable=0

          rulesets=$(gh api "repos/${GITHUB_REPOSITORY}/rulesets")
          protect_count=$(jq '[.[] | select(.name == "protect-main")] | length' <<<"$rulesets")
          if [ "$protect_count" -eq 0 ]; then
            echo "::error::protect-main ruleset not found: branch protection is decided only in GitHub's state, and without this ruleset merges are not gated by Required checks (Unity) or Required checks (generators)."
            exit 1
          fi
          if [ "$protect_count" -gt 1 ]; then
            echo "::error::protect-main ruleset is ambiguous ($protect_count matches): lookup is by name so recreating the ruleset must not leave the check passing against nothing."
            exit 1
          fi

          ruleset_id=$(jq -r '.[] | select(.name == "protect-main") | .id' <<<"$rulesets")
          ruleset=$(gh api "repos/${GITHUB_REPOSITORY}/rulesets/${ruleset_id}")

          enforcement=$(jq -r '.enforcement' <<<"$ruleset")
          if [ "$enforcement" != "active" ]; then
            echo "::error::protect-main enforcement is '${enforcement}', expected 'active': inactive or disabled enforcement would let merges bypass Required checks (Unity) and Required checks (generators) without a code change."
            failed=1
          fi

          ref_include_count=$(jq '[.conditions.ref_name.include[]?] | length' <<<"$ruleset")
          if [ "$ref_include_count" -ne 1 ] || [ "$(jq -r '.conditions.ref_name.include[0] // empty' <<<"$ruleset")" != "refs/heads/main" ]; then
            actual=$(jq -c '.conditions.ref_name.include // []' <<<"$ruleset")
            echo "::error::protect-main conditions.ref_name.include must be exactly [\"refs/heads/main\"], got ${actual}: only main is protected by design; an extra ref would gate branches this repository does not intend to protect."
            failed=1
          fi

          rsc_rule_count=$(jq '[.rules[]? | select(.type == "required_status_checks")] | length' <<<"$ruleset")
          if [ "$rsc_rule_count" -eq 0 ]; then
            echo "::error::protect-main has no required_status_checks rule: without it merges are not gated by Required checks (Unity) and Required checks (generators), which are the two aggregates this repository deliberately requires."
            failed=1
          elif [ "$rsc_rule_count" -gt 1 ]; then
            echo "::error::protect-main has ${rsc_rule_count} required_status_checks rules, expected exactly one: duplicate rules would make the required-context assertion ambiguous."
            failed=1
          else
            strict=$(jq -r '.rules[] | select(.type == "required_status_checks") | .parameters.strict_required_status_checks_policy' <<<"$ruleset")
            if [ "$strict" != "false" ]; then
              echo "::error::protect-main strict_required_status_checks_policy is '${strict}', expected false: requiring every head to be up to date would serialise every merge against a 21-25 minute Unity matrix, and a silent flip to true would look like GitHub being slow rather than like a setting change."
              failed=1
            fi

            context_count=$(jq '[.rules[] | select(.type == "required_status_checks") | .parameters.required_status_checks[]?] | length' <<<"$ruleset")
            contexts=$(jq -c '[.rules[] | select(.type == "required_status_checks") | .parameters.required_status_checks[].context]' <<<"$ruleset")
            unity_count=$(jq '[.rules[] | select(.type == "required_status_checks") | .parameters.required_status_checks[]? | select(.context == "Required checks (Unity)")] | length' <<<"$ruleset")
            generators_count=$(jq '[.rules[] | select(.type == "required_status_checks") | .parameters.required_status_checks[]? | select(.context == "Required checks (generators)")] | length' <<<"$ruleset")
            if [ "$context_count" -ne 2 ] || [ "$unity_count" -ne 1 ] || [ "$generators_count" -ne 1 ]; then
              echo "::error::protect-main required_status_checks must list exactly Required checks (Unity) and Required checks (generators), got ${contexts} (${context_count} entries): those names are the required-checks aggregates in test.yml and this workflow, and branch protection must require both."
              failed=1
            fi
          fi

          repo=$(gh api "repos/${GITHUB_REPOSITORY}")
          if jq -e 'has("delete_branch_on_merge")' <<<"$repo" >/dev/null; then
            delete_on_merge=$(jq -r '.delete_branch_on_merge' <<<"$repo")
            if [ "$delete_on_merge" != "true" ]; then
              echo "::error::delete_branch_on_merge is '${delete_on_merge}', expected true: merged pull request branches accumulate on the remote when this is off — fifty-four of sixty-six remote branches were from merged pull requests before anyone noticed."
              failed=1
            fi
          else
            echo "::warning::delete_branch_on_merge is absent from the repository API response for GITHUB_TOKEN: merged pull request branches accumulate on the remote when this is off — fifty-four of sixty-six remote branches were from merged pull requests before anyone noticed — and this check cannot verify the setting until the response exposes the field."
            unverifiable=$((unverifiable + 1))
          fi

          if jq -e 'has("bypass_actors")' <<<"$ruleset" >/dev/null; then
            bypass_count=$(jq '[.bypass_actors[]?] | length' <<<"$ruleset")
            if [ "$bypass_count" -ne 0 ]; then
              bypass=$(jq -c '.bypass_actors' <<<"$ruleset")
              echo "::error::protect-main bypass_actors must be empty, got ${bypass} (${bypass_count} entries): a non-empty bypass list would let named actors merge without Required checks (Unity) and Required checks (generators)."
              failed=1
            fi
          else
            echo "::warning::protect-main bypass_actors is absent from the ruleset API response for GITHUB_TOKEN: a non-empty bypass list would let named actors merge without Required checks (Unity) and Required checks (generators) — and this check cannot verify the list is empty until the response exposes the field."
            unverifiable=$((unverifiable + 1))
          fi

          if [ "$unverifiable" -gt 0 ]; then
            echo "::warning::${unverifiable} repository setting(s) could not be verified — GITHUB_TOKEN's API response omitted the field; see messages above."
          fi

          exit "$failed"

  # ---------------------------------------------------------------------------
  # This workflow's half of what branch protection requires. Same ownership rule
  # as the aggregate in test.yml, and a distinct name so protection can name both.
  # ---------------------------------------------------------------------------
  required-checks:
    name: Required checks (generators)
    if: always()
    needs: [source-generators, repository-settings]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ needs.source-generators.result }} ${{ needs.repository-settings.result }}
        run: |
          failed=0
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::dependency finished as '$result'"; failed=1 ;;
            esac
          done
          exit "$failed"
