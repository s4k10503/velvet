name: Automerge

# Merges a pull request labelled `automerge` once every check on its head has passed or been skipped, through
# `settle.py merge`, so every precondition a merge by hand is held to applies here too.
# CONTRIBUTING.md's continuous-integration section owns the label's meaning, what asks again and the
# secret.
#
# Not GitHub's native auto-merge: that merges once `protect-main`'s rules pass, and settle's
# red-base, unpublished-release, release-containment and long-lived-head preconditions, read at the
# moment of the merge, are not among them.
#
# No job checks out the pull request: these jobs hold write access, and the only code of this
# repository they run is the default branch's.
on:
  workflow_run:
    workflows: [Test, Source generators, UPM]
    types: [completed]
  pull_request_target:
    types: [labeled, ready_for_review]
  workflow_dispatch:
    inputs:
      number:
        description: "Pull request to merge, if nothing blocks it"
        required: true
      after_run:
        description: "A workflow run to wait for first (the hand-off passes its own)"
        required: false

permissions: {}

# Same reason test.yml gives.
env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  # A pull_request_target event's jobs are checks on the pull request's head, so a merge decided
  # inside this run would find its own job pending there. It dispatches the merge run instead, which
  # waits for this run to finish.
  hand-off:
    name: Hand the labelled pull request to a merge run
    if: >-
      github.event_name == 'pull_request_target'
      && ((github.event.action == 'labeled' && github.event.label.name == 'automerge')
          || (github.event.action == 'ready_for_review'
              && contains(github.event.pull_request.labels.*.name, 'automerge')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
          RUN: ${{ github.run_id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: >-
          gh workflow run automerge.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH"
          -f number="$NUMBER" -f after_run="$RUN"

  # This job's `if` and the sweep's are automerge.py's `run_selection` taken again, so a completed
  # run it would decline starts no job. test_automerge.py holds the workflow names in them to its.
  merge:
    name: Merge when green
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'workflow_run'
          && github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'pull_request'
          && contains(fromJSON('["Test", "Source generators"]'), github.event.workflow_run.name))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # One merge run per pull request at a time, since each required workflow completing starts one.
    # Job-level rather than workflow-level: a run waiting in the group is cancelled when another joins
    # it, and a cancelled hand-off would sit on the pull request's head as a failed check.
    concurrency:
      group: automerge-${{ inputs.number || github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_sha }}
      cancel-in-progress: false
    steps:
      # The default branch whatever ref a dispatch named, deep enough for settle's containment readings.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
          NUMBER: ${{ inputs.number }}
          AFTER_RUN: ${{ inputs.after_run }}
        run: python3 scripts/pr/automerge.py --number "$NUMBER" --after-run "$AFTER_RUN"

  sweep:
    name: Ask about the labelled pull requests
    if: >-
      github.event_name == 'workflow_run'
      && github.event.workflow_run.conclusion == 'success'
      && ((github.event.workflow_run.event == 'push'
           && github.event.workflow_run.head_branch == github.event.repository.default_branch
           && contains(fromJSON('["Test", "Source generators"]'), github.event.workflow_run.name))
          || (github.event.workflow_run.event == 'workflow_dispatch'
              && github.event.workflow_run.name == 'UPM'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    concurrency:
      group: automerge-sweep
      cancel-in-progress: false
    steps:
      # Same checkout as the merge job's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
        run: python3 scripts/pr/automerge.py
