name: Automerge

# Merges a pull request labelled `automerge` once its head's own checks are green, through
# `settle.py merge`, so every precondition a merge by hand is held to applies here too.
# CONTRIBUTING.md's continuous-integration section owns the label's meaning and the secret.
#
# Not GitHub's native auto-merge, for the reason .harness/hooks/refuse/merge_unproven_head.py gives.
#
# No job checks out the pull request: these jobs hold write access, and the only code of this
# repository they run is the default branch's.
on:
  workflow_run:
    workflows: [Test, Source generators]
    types: [completed]
  pull_request_target:
    types: [labeled]
  workflow_dispatch:
    inputs:
      number:
        description: "Pull request to merge, if nothing blocks it"
        required: true
      after_run:
        description: "A workflow run to wait for first (the hand-off passes its own)"
        required: false

permissions: {}

# Same reason test.yml gives.
env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  # A labelled event's jobs are checks on the pull request's head, so a merge decided inside this run
  # would find its own job pending there. It dispatches the merge run instead, which waits for this
  # run to finish.
  hand-off:
    name: Hand the labelled pull request to a merge run
    if: github.event_name == 'pull_request_target' && github.event.label.name == 'automerge'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
          RUN: ${{ github.run_id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: >-
          gh workflow run automerge.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH"
          -f number="$NUMBER" -f after_run="$RUN"

  merge:
    name: Merge when green
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # One merge run per pull request at a time, since each required workflow completing starts one.
    # Job-level rather than workflow-level: a run waiting in the group is cancelled when another joins
    # it, and a cancelled hand-off would sit on the pull request's head as a failed check.
    concurrency:
      group: automerge-${{ inputs.number || github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.head_sha }}
      cancel-in-progress: false
    steps:
      # The default branch whatever ref a dispatch named, deep enough for settle's containment readings.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
          NUMBER: ${{ inputs.number }}
          AFTER_RUN: ${{ inputs.after_run }}
        run: python3 scripts/pr/automerge.py --number "$NUMBER" --after-run "$AFTER_RUN"
