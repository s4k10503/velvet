name: Benchmarks

# The measured PlayMode benchmarks (Velvet.Tests.Performance), outside the required pull-request run.
# test.yml runs them as well, but as one iteration with no warmup (BenchmarkRun in TestUtilities), which
# keeps their exception coverage; this workflow passes the flag that restores the counts each declares
# and records the medians. CONTRIBUTING.md's benchmarks section owns when they run, where the numbers
# live and how to read them.
#
# Not a required workflow: no job here is named "Required checks", nothing aggregates it, and a trigger
# filter on push is free to stop it starting. A pull request runs it only while it carries the
# `benchmarks` label; the labeled and synchronize types are the ones that fire, so a push to a labelled
# pull request measures the new head.
on:
  push:
    branches: [main]
    paths:
      - 'Packages/com.velvet.core/**'
      - '!Packages/com.velvet.core/Generators~/**'
      - '!Packages/com.velvet.core/Documentation~/**'
      - '.github/workflows/benchmarks.yml'
      - 'scripts/ci/benchmark_results.py'
      - 'scripts/test_quality/assert_no_inconclusive.py'
      - 'scripts/test_quality/assert_results_from_this_tree.py'
      - '!**.md'
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:

# Least privilege: the Unity job runs the pull request's own code, so it holds read access only.
# checks:write lets game-ci publish the test-result check run. The one job that pushes history raises
# contents itself.
permissions:
  contents: read
  checks: write

# Same reason test.yml gives.
env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  license-check:
    name: Check Unity license secret
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      has_license: ${{ steps.check.outputs.has_license }}
    steps:
      - id: check
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -n "$UNITY_LICENSE" ]; then
            echo "has_license=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_license=false" >> "$GITHUB_OUTPUT"
            echo "::notice::UNITY_LICENSE secret is not set — the benchmarks measure nothing."
          fi

  benchmarks:
    name: Benchmarks (PlayMode)
    needs: license-check
    # A labeled event for another label than `benchmarks` starts nothing, even where that one is already on.
    if: >-
      needs.license-check.outputs.has_license == 'true'
      && (!github.event.pull_request
          || (contains(github.event.pull_request.labels.*.name, 'benchmarks')
              && (github.event.action != 'labeled' || github.event.label.name == 'benchmarks')))
    # A newer head of a labelled pull request cancels the run still measuring an older one. Only a run
    # that can benchmark joins the pull request's group: any other event (another label being added, a
    # push to main, a dispatch) takes a group of its own by run id, so it neither cancels a measuring
    # run nor is cancelled into skipping everything. A run on main is a data point and is never cancelled.
    concurrency:
      group: >-
        benchmarks-${{ github.event_name == 'pull_request'
        && (github.event.action != 'labeled' || github.event.label.name == 'benchmarks')
        && github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Library
          key: Library-PlayMode-${{ hashFiles('Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-PlayMode-

      - name: Run the benchmarks
        id: unity-tests
        timeout-minutes: 30
        uses: game-ci/unity-test-runner@0ff419b913a3630032cbe0de48a0099b5a9f0ed9 # v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.23f1
          testMode: PlayMode
          projectPath: .
          artifactsPath: benchmark-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          customParameters: -testFilter "Velvet.Tests.Performance" -velvetBenchmarkFull

      - name: Assert no inconclusive results
        if: always()
        run: python3 scripts/test_quality/assert_no_inconclusive.py benchmark-results

      - name: Assert the results are this checkout's
        if: always()
        run: python3 scripts/test_quality/assert_results_from_this_tree.py benchmark-results

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: Benchmark results
          path: benchmark-results

      - name: Convert the medians
        run: |
          python3 scripts/ci/benchmark_results.py benchmark-results \
            --json benchmark.json --summary benchmark-summary.md
          { echo '### Benchmark medians'; echo; cat benchmark-summary.md; } >> "$GITHUB_STEP_SUMMARY"

      - name: Echo the medians as annotations
        if: always()
        run: |
          python3 - <<'PY'
          import json
          cpu = next((l.split(':', 1)[1].strip() for l in open('/proc/cpuinfo') if l.startswith('model name')), '?')
          rows = json.load(open('benchmark.json'))
          merged = {}
          for r in rows:
              test, _, group = r['name'].partition(' / ')
              kind = group[:2]
              key = (test.split('.')[-1], group[2:] if kind in ('S.', 'C.') else group)
              slot = merged.setdefault(key, {})
              slot['c' if kind == 'C.' else 'v'] = r['value']
          lines = [f"CPU {cpu}"]
          for (test, name), v in sorted(merged.items()):
              if 'v' in v:
                  lines.append(f"{test}|{name}|{v['v']:.3f}|{v.get('c', '')}")
          chunks, cur, size = [], [], 0
          for l in lines:
              if size + len(l) > 5500 and cur:
                  chunks.append(cur); cur, size = [], 0
              cur.append(l); size += len(l) + 1
          chunks.append(cur)
          for i, c in enumerate(chunks[:9]):
              print(f"::notice title=medians {i + 1}/{len(chunks)}::" + '%0A'.join(c))
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Benchmark medians
          path: benchmark.json

  # History on main: one entry per run, kept on a data branch so the documentation site's Pages
  # deployment is left alone. The only job here that pushes, so the only one holding contents: write;
  # it executes nothing from the artifact beyond reading it as data.
  trend-main:
    name: Benchmark history
    needs: benchmarks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Benchmark medians

      # The action fetches the data branch and switches to it, and never creates it. An empty orphan commit
      # holding a README starts the history; a push that loses a race to another creator is fine so long
      # as the branch exists afterwards.
      - name: Create the data branch when absent
        run: |
          if [ -z "$(git ls-remote --heads origin benchmark-data)" ]; then
            blob=$(echo 'Benchmark history written by .github/workflows/benchmarks.yml.' | git hash-object -w --stdin)
            tree=$(printf '100644 blob %s\tREADME.txt\n' "$blob" | git mktree)
            commit=$(git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com \
              commit-tree "$tree" -m 'Start the benchmark history')
            git push origin "$commit:refs/heads/benchmark-data" \
              || test -n "$(git ls-remote --heads origin benchmark-data)"
          fi

      - uses: benchmark-action/github-action-benchmark@4bdcce38c94cec68da58d012ac24b7b1155efe8b # v1.20.7
        with:
          name: Velvet benchmarks
          tool: customSmallerIsBetter
          output-file-path: benchmark.json
          gh-pages-branch: benchmark-data
          benchmark-data-dir-path: dev/bench
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          max-items-in-chart: 200
          summary-always: true
          alert-threshold: '150%'
          comment-on-alert: false
          fail-on-alert: false

  # A labelled pull request is compared with main's latest entry in the job summary. Nothing is pushed
  # and no comment is written, so the job needs no more than read access; a regression shows in the
  # summary and does not fail the run, because a CI runner's timings are noisy.
  trend-pull-request:
    name: Benchmark comparison
    needs: benchmarks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Benchmark medians

      # Reading the history is best effort: before main has recorded one, there is nothing to compare with.
      - uses: benchmark-action/github-action-benchmark@4bdcce38c94cec68da58d012ac24b7b1155efe8b # v1.20.7
        continue-on-error: true
        with:
          name: Velvet benchmarks
          tool: customSmallerIsBetter
          output-file-path: benchmark.json
          gh-pages-branch: benchmark-data
          benchmark-data-dir-path: dev/bench
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: false
          save-data-file: false
          summary-always: true
          alert-threshold: '150%'
          comment-on-alert: false
          fail-on-alert: false
