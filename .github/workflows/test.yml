name: Test

# Filter the push trigger, never pull_request or merge_group. A required check GitHub is asked to require
# reports Pending forever when a filter stops its workflow from starting, and nothing can clear it; whether
# GitHub honours the filter on a given trigger today is not something to bet the merge path on. The push
# filter is a different question — a push to main has already passed the pull request — so it keeps the
# list. WorkflowTriggerCoverageTests holds both the absence of those filters and the presence of both
# triggers, the latter because merge_group subscribes through a key with no children and pull_request was
# held by nothing at all.
#
# Generators~ sources stay out of the push list: the Unity side consumes their committed DLLs under
# Runtime/Plugins, so a generator change reaches this workflow when the redeployed DLLs are committed.
#
# Every markdown file is in, in one pattern rather than a file list, because DocumentationDriftTests
# scans the repository's markdown and a document whose change starts no run drifts without anything
# reporting it. It sits after the Generators~ exclusion so the markdown under that directory is
# re-included: the last matching pattern is the one that decides.
on:
  push:
    branches: [main]
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - 'scripts/**'
      - '.github/workflows/test.yml'
      - '!Packages/com.velvet.core/Generators~/**'
      - '**.md'
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: read the source; checks:write lets game-ci publish the test-result check run
# (without it the Unity jobs fail with "Resource not accessible by integration").
permissions:
  contents: read
  checks: write

jobs:
  # ---------------------------------------------------------------------------
  # Detect whether a Unity license secret is configured. Secrets cannot be
  # referenced directly in a job-level `if`, so expose it as an output here.
  # ---------------------------------------------------------------------------
  license-check:
    name: Check Unity license secret
    runs-on: ubuntu-latest
    outputs:
      has_license: ${{ steps.check.outputs.has_license }}
    steps:
      - id: check
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -n "$UNITY_LICENSE" ]; then
            echo "has_license=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_license=false" >> "$GITHUB_OUTPUT"
            echo "::notice::UNITY_LICENSE secret is not set — skipping Unity EditMode/PlayMode tests. See README/CONTRIBUTING for Personal license activation."
          fi

  # ---------------------------------------------------------------------------
  # Unity EditMode / PlayMode tests via game-ci. Requires a Unity license.
  # A free Personal license works: activate manually (request .alf, upload to
  # id.unity.com, download the .ulf) and store its contents as the UNITY_LICENSE
  # secret, plus UNITY_EMAIL / UNITY_PASSWORD.
  #
  # NOTE: the game-ci editor Docker image for the pinned Unity version must
  # exist (see https://game.ci/docs and unityci/editor tags). Very new editor
  # versions may not have an image yet.
  # ---------------------------------------------------------------------------
  unity-tests:
    name: Unity tests (${{ matrix.testMode }})
    needs: license-check
    if: needs.license-check.outputs.has_license == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        testMode: [EditMode, PlayMode]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Library
          key: Library-${{ matrix.testMode }}-${{ hashFiles('Packages/**', 'ProjectSettings/**') }}
          # No bare Library- fallback: it matches across test modes, and an EditMode job was measured
          # restoring a cache whose key begins Library-PlayMode-.
          restore-keys: |
            Library-${{ matrix.testMode }}-

      - name: Run ${{ matrix.testMode }} tests
        id: unity-tests
        uses: game-ci/unity-test-runner@0ff419b913a3630032cbe0de48a0099b5a9f0ed9 # v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          # Deliberately ahead of ProjectVersion.txt's 6000.3.11f1. game-ci passes -enableCodeCoverage
          # and -debugCodeOptimization unconditionally, and on 6000.3.11f1 that combination SIGSEGVs
          # inside ScriptingCoverage::FilterRecordedMethods when a script reload happens during a run.
          # Unity's 6000.3.14f1 release notes carry the fix as UUM-137724, "Added main-thread guard in
          # ScriptingCoverage::FilterRecordedMethods for thread safety during script reload".
          #
          # What this costs: the floor version is no longer the one under test. It is bounded — the crash
          # needs -enableCodeCoverage, which nothing but this workflow passes, so no consumer on the floor
          # is exposed to it — but a Velvet defect that appears only on 6000.3.11f1 would now go unseen.
          unityVersion: 6000.3.21f1
          testMode: ${{ matrix.testMode }}
          projectPath: .
          artifactsPath: ${{ matrix.testMode }}-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          # Without assemblyFilters the default covers Assets/ only, and the package lives under
          # Packages/com.velvet.core: measured, the default reports 236 coverable lines of sample
          # code where the filter below reports 27255 of the package's own.
          # Unity.Velvet.CodeGen is left out because the compilation pipeline loads it rather than
          # the test domain, so a figure for it would read zero for code every compile exercises.
          coverageOptions: >-
            generateAdditionalMetrics;generateHtmlReport;generateBadgeReport;dontClear;assemblyFilters:+Velvet,+Velvet.Editor

      # Unity exits 0 on an inconclusive case and game-ci's reporter reads only
      # passed/failed/skipped off <test-run>, so a test whose Assume stopped holding
      # would leave this job green. always() reports both tallies on a run that also
      # has failures.
      - name: Assert no inconclusive results
        if: always()
        run: python3 scripts/test_quality/assert_no_inconclusive.py "${{ matrix.testMode }}-results"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: Test results (${{ matrix.testMode }})
          path: ${{ matrix.testMode }}-results

      # game-ci passes -enableCodeCoverage on every run whatever this workflow asks for, so the
      # recorder's cost is paid either way; what the manifest's com.unity.testtools.codecoverage
      # adds is the directory this output names.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: Code coverage (${{ matrix.testMode }})
          path: ${{ steps.unity-tests.outputs.coveragePath }}

  # ---------------------------------------------------------------------------
  # The release note is assembled from the CHANGELOG at release time, by which point no pull
  # request is left to fail: a version section that cannot produce one would publish a release
  # whose body is missing rather than stopping anything. This runs the same builder here, so
  # that failure lands on the pull request that introduced it. No Unity license needed.
  # ---------------------------------------------------------------------------
  release-notes:
    name: Release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: python3 scripts/release/test_release_notes.py

  # ---------------------------------------------------------------------------
  # CONTRIBUTING.md's release section owns why this exists; scripts/release/published_check.py owns
  # which question is asked of which tree.
  #
  # The publication question is posed only where a merge is being decided, so `--base` is empty on
  # push and workflow_dispatch. Posing it there instead reddens the release commit's own run — that
  # commit IS the state, and no push run happens again after the dispatch clears it, so main would
  # keep a red run for the release forever.
  #
  # It is also only half a guard where it does run: a pull request that went green BEFORE the release
  # landed keeps that green result, since main does not require heads to be up to date
  # (CONTRIBUTING.md). settle.py's contains-base precondition and stale_merge.py are what refuse such
  # a merge until the branch takes main in, and that push is a new head, which lands here.
  #
  # The base is named from the event rather than derived from the checkout's shape: the event states
  # which commit it is, and nothing about how the checkout is configured has to stay true for that to
  # keep holding. fetch-depth 0 for the same reason — whatever commit the event names is present,
  # without a claim about how far back a window has to reach. A base that cannot be read raises here
  # rather than answering, and a red job is indistinguishable from a refusal, so the depth is not the
  # place to economise.
  # ---------------------------------------------------------------------------
  publication:
    name: Release publication
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - run: python3 scripts/release/test_published_check.py

      - env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          python3 scripts/release/published_check.py --result HEAD \
            ${BASE:+--base "$BASE"}

  # ---------------------------------------------------------------------------
  # A test written to pin a change has to be red without it, and nothing here asked. The Python half
  # of that question is answered outright: base_red_check.py checks out the merge base, copies this
  # branch's changed test modules onto it, and runs the changed cases there, which for Python is the
  # whole run and costs seconds. The C# half needs an editor and is in `base-red` below.
  #
  # fetch-depth 0 because the merge base is what the question is asked against, and a shallow clone
  # has no merge base to find.
  # ---------------------------------------------------------------------------
  base-red-python:
    name: Base-red check (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          python3 scripts/test_quality/base_red_check.py --lane python \
            --base "${BASE:-HEAD^}"

  # ---------------------------------------------------------------------------
  # The C# half of the same question. It reaches Unity through the same action the suite does, so it
  # is split in two: the first step builds the base tree and writes what it read, the action runs the
  # fixtures over that tree, and the last step takes the verdict from the results file. Nothing in
  # between has to hand back an editor log.
  #
  # needs: unity-tests is load-bearing rather than tidiness. "It did not compile on the base" is only
  # evidence about the branch where the same file compiles ON the branch, and that job is what says so.
  #
  # This is one round of a loop the local harness runs to a fixed point, and the difference decides
  # what it can catch. A base that cannot build one carried file writes no results for anything, so a
  # single round cannot tell which file that was: it reads as the base building none of the branch's
  # tests, which passes. The harness withdraws one carried file and asks again until something runs,
  # which is how it separates them — so `base_red_check.py` run locally is the sharper reading of the
  # same branch, and what stays here is the case the base DID build and answer green, which is the
  # one this exists for.
  # ---------------------------------------------------------------------------
  base-red:
    name: Base-red check (${{ matrix.testMode }})
    needs: [license-check, unity-tests]
    if: needs.license-check.outputs.has_license == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        testMode: [EditMode, PlayMode]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          lfs: true

      - id: read
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 scripts/test_quality/base_red_check.py --lane csharp \
            --platform "${{ matrix.testMode }}" --base "$BASE" \
            --base-tree base-tree --emit plan.json | tee reading.txt
          grep '^fixtures=' reading.txt >> "$GITHUB_OUTPUT" || true

      # After the reading, not before: the tree is a worktree git refuses to create over a directory
      # that already holds a Library.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.read.outputs.fixtures != ''
        with:
          path: base-tree/Library
          key: BaseLibrary-${{ matrix.testMode }}-${{ github.event.pull_request.base.sha }}
          restore-keys: |
            BaseLibrary-${{ matrix.testMode }}-

      # continue-on-error because a base that cannot build the branch's test file is the answer, not
      # a broken job. Which of the two it was is settled by the step after this from the results file.
      - uses: game-ci/unity-test-runner@0ff419b913a3630032cbe0de48a0099b5a9f0ed9 # v4
        if: steps.read.outputs.fixtures != ''
        continue-on-error: true
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          # The version unity-tests runs, for the reason stated there.
          unityVersion: 6000.3.21f1
          testMode: ${{ matrix.testMode }}
          projectPath: base-tree
          artifactsPath: base-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          customParameters: -testFilter "${{ steps.read.outputs.fixtures }}"

      - if: steps.read.outputs.fixtures != ''
        run: |
          python3 scripts/test_quality/base_red_check.py \
            --verdict plan.json --results base-results

  # ---------------------------------------------------------------------------
  # mutation_check.py needs a licence to kill a mutant, but not to build one, and the building is
  # the half everything else rests on: an operator that emits uncompilable C# reports that mutant as
  # noise rather than as a survivor, so a real hole hides behind it. That half runs here, and
  # base_red_check.py's reader is here for the same reason: a case its parser misses is a case the
  # base is never asked about, and the run comes back green having measured one fewer thing.
  # ---------------------------------------------------------------------------
  test-quality:
    name: Test quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: python3 scripts/test_quality/test_mutation_check.py

      - run: python3 scripts/test_quality/test_neuter_check.py

      - run: python3 scripts/test_quality/test_base_red_check.py

  # ---------------------------------------------------------------------------
  # The one check branch protection requires from this workflow. Naming a real
  # job instead would tie branch protection to that job's name and to its
  # continuing to run at all; this reports for every pull request whatever the
  # jobs above do.
  #
  # skipped counts as passing, which is what lets a fork with no UNITY_LICENSE
  # merge anything: unity-tests is skipped in exactly that case. cancelled does
  # not, because a superseded run and a run somebody stopped both arrive here
  # with nothing having been tested.
  # ---------------------------------------------------------------------------
  required-checks:
    name: Required checks (Unity)
    if: always()
    needs: [license-check, unity-tests, release-notes, publication, test-quality, base-red-python, base-red]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ needs.license-check.result }} ${{ needs.unity-tests.result }} ${{ needs.release-notes.result }} ${{ needs.publication.result }} ${{ needs.test-quality.result }} ${{ needs.base-red-python.result }} ${{ needs.base-red.result }}
        run: |
          failed=0
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::dependency finished as '$result'"; failed=1 ;;
            esac
          done
          exit "$failed"
