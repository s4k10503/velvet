name: Test

# pull_request carries no path filter, and must not gain one. A check GitHub is asked to require reports
# Pending forever when a path filter stops its workflow from starting, which blocks the pull request with
# no way to satisfy it. The push filter is a different question — a push to main has already passed the
# pull request — so it keeps the list, and WorkflowTriggerCoverageTests holds both halves.
#
# Generators~ sources stay out of the push list: the Unity side consumes their committed DLLs under
# Runtime/Plugins, so a generator change reaches this workflow when the redeployed DLLs are committed.
# Markdown under it is back in, because a guard here reads the contributor README.
on:
  push:
    branches: [main]
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - 'scripts/**'
      - 'CLAUDE.md'
      - 'README.md'
      - '.github/workflows/test.yml'
      - '!Packages/com.velvet.core/Generators~/**'
      - 'Packages/com.velvet.core/Generators~/*.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: read the source; checks:write lets game-ci publish the test-result check run
# (without it the Unity jobs fail with "Resource not accessible by integration").
permissions:
  contents: read
  checks: write

jobs:
  # ---------------------------------------------------------------------------
  # Detect whether a Unity license secret is configured. Secrets cannot be
  # referenced directly in a job-level `if`, so expose it as an output here.
  # ---------------------------------------------------------------------------
  license-check:
    name: Check Unity license secret
    runs-on: ubuntu-latest
    outputs:
      has_license: ${{ steps.check.outputs.has_license }}
    steps:
      - id: check
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -n "$UNITY_LICENSE" ]; then
            echo "has_license=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_license=false" >> "$GITHUB_OUTPUT"
            echo "::notice::UNITY_LICENSE secret is not set — skipping Unity EditMode/PlayMode tests. See README/CONTRIBUTING for Personal license activation."
          fi

  # ---------------------------------------------------------------------------
  # Unity EditMode / PlayMode tests via game-ci. Requires a Unity license.
  # A free Personal license works: activate manually (request .alf, upload to
  # id.unity.com, download the .ulf) and store its contents as the UNITY_LICENSE
  # secret, plus UNITY_EMAIL / UNITY_PASSWORD.
  #
  # NOTE: the game-ci editor Docker image for the pinned Unity version must
  # exist (see https://game.ci/docs and unityci/editor tags). Very new editor
  # versions may not have an image yet.
  # ---------------------------------------------------------------------------
  unity-tests:
    name: Unity tests (${{ matrix.testMode }})
    needs: license-check
    if: needs.license-check.outputs.has_license == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        testMode: [EditMode, PlayMode]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Library
          key: Library-${{ matrix.testMode }}-${{ hashFiles('Packages/**', 'ProjectSettings/**') }}
          # No bare Library- fallback: it matches across test modes, and an EditMode job was measured
          # restoring a cache whose key begins Library-PlayMode-.
          restore-keys: |
            Library-${{ matrix.testMode }}-

      - name: Run ${{ matrix.testMode }} tests
        uses: game-ci/unity-test-runner@0ff419b913a3630032cbe0de48a0099b5a9f0ed9 # v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          # Deliberately ahead of ProjectVersion.txt's 6000.3.11f1. game-ci passes -enableCodeCoverage
          # and -debugCodeOptimization unconditionally, and on 6000.3.11f1 that combination SIGSEGVs
          # inside ScriptingCoverage::FilterRecordedMethods when a script reload happens during a run.
          # Unity's 6000.3.14f1 release notes carry the fix as UUM-137724, "Added main-thread guard in
          # ScriptingCoverage::FilterRecordedMethods for thread safety during script reload".
          #
          # What this costs: the floor version is no longer the one under test. It is bounded — the crash
          # needs -enableCodeCoverage, which nothing but this workflow passes, so no consumer on the floor
          # is exposed to it — but a Velvet defect that appears only on 6000.3.11f1 would now go unseen.
          unityVersion: 6000.3.21f1
          testMode: ${{ matrix.testMode }}
          projectPath: .
          artifactsPath: ${{ matrix.testMode }}-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      # Unity exits 0 on an inconclusive case and game-ci's reporter reads only
      # passed/failed/skipped off <test-run>, so a test whose Assume stopped holding
      # would leave this job green. always() reports both tallies on a run that also
      # has failures.
      - name: Assert no inconclusive results
        if: always()
        run: python3 scripts/assert-no-inconclusive.py "${{ matrix.testMode }}-results"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: Test results (${{ matrix.testMode }})
          path: ${{ matrix.testMode }}-results

  # ---------------------------------------------------------------------------
  # The one check branch protection requires from this workflow. Naming a real
  # job instead would tie branch protection to that job's name and to its
  # continuing to run at all; this reports for every pull request whatever the
  # jobs above do.
  #
  # skipped counts as passing, which is what lets a fork with no UNITY_LICENSE
  # merge anything: unity-tests is skipped in exactly that case. cancelled does
  # not, because a superseded run and a run somebody stopped both arrive here
  # with nothing having been tested.
  # ---------------------------------------------------------------------------
  required-checks:
    name: Required checks (Unity)
    if: always()
    needs: [license-check, unity-tests]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ needs.license-check.result }} ${{ needs.unity-tests.result }}
        run: |
          failed=0
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::dependency finished as '$result'"; failed=1 ;;
            esac
          done
          exit "$failed"
