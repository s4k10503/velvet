name: Campaign status

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      pull_request:
        description: Optional pull request number to recover a single head
        required: false
        type: string
  workflow_run:
    workflows: [Mutation campaign]
    types: [requested, in_progress, completed]
  pull_request_target:
    types: [labeled, unlabeled, ready_for_review, synchronize, reopened]

permissions: {}

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  publish:
    name: Publish mutation campaign progress
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      pull-requests: read
      statuses: write
    concurrency:
      group: campaign-status-${{ github.repository }}
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/pr/campaign_status.py
