name: Kill set

# Proves that a pull request which only deletes tests loses no mutant kill. The mutation campaign places
# no mutant for such a change, so it proves nothing for it; this measures the mutants of the production
# files named in `files` on the pull request's merge base and again on its head, and fails when a mutant
# the base's tests killed survives on the head. CONTRIBUTING.md ▸ Checking that the tests can fail owns
# when to run it and what the pull request body says about the result.
#
# Dispatched by hand, never by an event, and no branch-protection rule requires it. Not a run on every
# pull request: a shard measures each of its mutants against the whole suite on two trees.
on:
  workflow_dispatch:
    inputs:
      files:
        description: "Production sources whose mutants are measured, space-separated, e.g. Packages/com.velvet.core/Runtime/Foo.cs"
        required: true
      assemblies:
        description: "Comma-separated test assemblies the suite is narrowed to; empty is every one"
        required: false
      base:
        description: "The branch the pull request merges into; the tree measured is its merge base with head"
        required: true
        default: main
      head:
        description: "The pull request's branch or commit"
        required: true
      platform:
        description: "The suite to measure"
        required: true
        default: EditMode
        type: choice
        options:
          - EditMode
          - PlayMode

# A newer dispatch for the same head replaces the one still measuring it.
concurrency:
  group: kill-set-${{ inputs.head }}
  cancel-in-progress: true

permissions:
  contents: read

# Same reason test.yml gives.
env:
  PYTHONDONTWRITEBYTECODE: "1"

# The shard job's two measuring steps are timed by KillSetShardTests against RUN_OUT_CEILING, and the job
# holds both and what surrounds them.
jobs:
  # Same reading as test.yml's job of this name.
  license-check:
    name: Check Unity license secret
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      has_license: ${{ steps.check.outputs.has_license }}
    steps:
      - id: check
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -n "$UNITY_LICENSE" ]; then
            echo "has_license=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_license=false" >> "$GITHUB_OUTPUT"
            echo "::notice::UNITY_LICENSE secret is not set — the comparison measures nothing."
          fi

  # ---------------------------------------------------------------------------
  # The two commits, and the mutants every shard measures on both. The list comes from the head's tree
  # and each shard hands it back to mutation_check.py on the base's, which refuses a tree that generates
  # another: the sources are the same on both refs, and a pull request that changes one of the files
  # measures a production change rather than a pruning, so it is refused here.
  # ---------------------------------------------------------------------------
  plan:
    name: Kill set (plan)
    needs: license-check
    if: needs.license-check.outputs.has_license == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      head: ${{ steps.head.outputs.sha }}
      base: ${{ steps.base.outputs.sha }}
      mutants: ${{ steps.plan.outputs.mutants }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head }}
          fetch-depth: 0

      - id: base
        run: python3 scripts/ci/change_base.py >> "$GITHUB_OUTPUT"

      - id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - env:
          BASE: ${{ steps.base.outputs.sha }}
          FILES: ${{ inputs.files }}
        run: |
          set -eu
          set -f
          # shellcheck disable=SC2086
          if ! git diff --quiet "$BASE" HEAD -- $FILES; then
            echo "::error::the head changes a file to be measured, so the two trees would not generate the same mutants"
            git diff --stat "$BASE" HEAD -- $FILES
            exit 1
          fi

      # A plan of no mutants proves nothing, so it fails here rather than passing the way a campaign's does.
      - id: plan
        env:
          BASE: ${{ steps.base.outputs.sha }}
          FILES: ${{ inputs.files }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          set +e
          set -f
          # shellcheck disable=SC2086
          python3 scripts/test_quality/mutation_check.py --base "$BASE" --files $FILES --platform "$PLATFORM" \
            --run-out --plan --emit-mutants mutants.json > plan.txt 2>&1
          status=$?
          cat plan.txt
          { echo '### Kill set plan'; echo '```'; cat plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          [ "$status" -eq 0 ] || exit "$status"
          grep -E '^(mutants|shards)=' plan.txt >> "$GITHUB_OUTPUT"
          if [ "$(sed -n 's/^mutants=//p' plan.txt)" = 0 ]; then
            echo "::error::no mutant was generated from these files"
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Kill set mutant list
          path: mutants.json
          overwrite: true

  # ---------------------------------------------------------------------------
  # The Library every shard restores, saved as mutation.yml's `library` job saves it, under the head's key.
  # ---------------------------------------------------------------------------
  library:
    name: Kill set (Library)
    needs: [license-check, plan]
    if: needs.license-check.outputs.has_license == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.head }}
          lfs: true

      - id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Library
          key: Library-EditMode-${{ hashFiles('Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-EditMode-

      - if: steps.restore.outputs.cache-hit != 'true'
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          version=$(sed -n 's/^m_EditorVersion: //p' ProjectSettings/ProjectVersion.txt)
          docker run --rm --init --workdir /github/workspace \
            --volume "$GITHUB_WORKSPACE:/github/workspace" \
            --env UNITY_LICENSE --env UNITY_EMAIL --env UNITY_PASSWORD \
            --env PYTHONDONTWRITEBYTECODE=1 \
            "unityci/editor:ubuntu-$version-linux-il2cpp-3" \
            python3 -u scripts/ci/licensed_editor.py -- -projectPath /github/workspace

      - if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Library
          key: Library-EditMode-${{ hashFiles('Packages/**', 'ProjectSettings/**') }}

  # ---------------------------------------------------------------------------
  # One job per shard measures its dealt mutants on the head tree and then, on the same runner, on the
  # base tree, and uploads each tree's verdict records. The job count is the shard count, which the plan
  # caps at mutation_check.MAX_SHARDS, and `max-parallel` keeps it to half the account's twenty
  # concurrent jobs.
  #
  # The tooling is copied out of the head's checkout before either tree is measured and run from the
  # copy, so the switch to the base tree changes the project and nothing that measures it.
  # ---------------------------------------------------------------------------
  shard:
    name: Kill set (shard ${{ matrix.shard }})
    needs: [license-check, plan, library]
    if: needs.license-check.outputs.has_license == 'true' && needs.plan.outputs.shards != '[]'
    runs-on: ubuntu-latest
    # The two measuring steps' timeouts and the checkout, restore, tree switch and uploads around them;
    # KillSetShardTests holds each step's timeout against its platform's ceiling.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      MUTANTS: ${{ needs.plan.outputs.mutants }}
      SHARDS: ${{ needs.plan.outputs.shards }}
      FILES: ${{ inputs.files }}
      ASSEMBLIES: ${{ inputs.assemblies }}
      PLATFORM: ${{ inputs.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.head }}
          fetch-depth: 0
          lfs: true

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Library
          key: Library-EditMode-${{ hashFiles('Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-EditMode-

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Kill set mutant list
          path: Logs/kill-set-list

      - id: base
        run: python3 scripts/ci/change_base.py >> "$GITHUB_OUTPUT"

      - name: Copy the tooling out of the project
        run: |
          mkdir -p "$RUNNER_TEMP/tools"
          cp -r scripts "$RUNNER_TEMP/tools/scripts"

      - name: Measure head
        timeout-minutes: 165
        env:
          BASE: ${{ steps.base.outputs.sha }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        # safe.directory names the workspace alone, for the reason mutation.yml's measuring steps give.
        run: |
          set -f
          version=$(sed -n 's/^m_EditorVersion: //p' ProjectSettings/ProjectVersion.txt)
          # shellcheck disable=SC2086
          docker run --rm --init --workdir /github/workspace \
            --volume "$GITHUB_WORKSPACE:/github/workspace" \
            --volume "$RUNNER_TEMP/tools:/tools:ro" \
            --env UNITY_LICENSE --env UNITY_EMAIL --env UNITY_PASSWORD \
            --env GIT_CONFIG_COUNT=1 --env GIT_CONFIG_KEY_0=safe.directory --env GIT_CONFIG_VALUE_0=/github/workspace \
            --env PYTHONDONTWRITEBYTECODE=1 \
            "unityci/editor:ubuntu-$version-linux-il2cpp-3" \
            python3 -u /tools/scripts/test_quality/ci_mutation_shard.py -- \
              --base "$BASE" --files $FILES ${ASSEMBLIES:+--assemblies "$ASSEMBLIES"} --platform "$PLATFORM" \
              --run-out --max "$MUTANTS" --mutants Logs/kill-set-list/mutants.json \
              --shard "${{ matrix.shard }}/$(echo "$SHARDS" | jq length)" \
              --output Logs/kill-set-head

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: Kill set head shard ${{ matrix.shard }}
          path: Logs/kill-set-head/mutant-*.json
          if-no-files-found: warn
          overwrite: true

      # As root, which the docker steps leave the workspace owned by. Library and Logs are untracked and stay.
      - name: Switch to the base tree
        env:
          BASE: ${{ steps.base.outputs.sha }}
        run: sudo git -c safe.directory="$GITHUB_WORKSPACE" checkout --force --detach "$BASE"

      - name: Measure base
        timeout-minutes: 165
        env:
          BASE: ${{ steps.base.outputs.sha }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -f
          version=$(sed -n 's/^m_EditorVersion: //p' ProjectSettings/ProjectVersion.txt)
          # shellcheck disable=SC2086
          docker run --rm --init --workdir /github/workspace \
            --volume "$GITHUB_WORKSPACE:/github/workspace" \
            --volume "$RUNNER_TEMP/tools:/tools:ro" \
            --env UNITY_LICENSE --env UNITY_EMAIL --env UNITY_PASSWORD \
            --env GIT_CONFIG_COUNT=1 --env GIT_CONFIG_KEY_0=safe.directory --env GIT_CONFIG_VALUE_0=/github/workspace \
            --env PYTHONDONTWRITEBYTECODE=1 \
            "unityci/editor:ubuntu-$version-linux-il2cpp-3" \
            python3 -u /tools/scripts/test_quality/ci_mutation_shard.py -- \
              --base "$BASE" --files $FILES ${ASSEMBLIES:+--assemblies "$ASSEMBLIES"} --platform "$PLATFORM" \
              --run-out --max "$MUTANTS" --mutants Logs/kill-set-list/mutants.json \
              --shard "${{ matrix.shard }}/$(echo "$SHARDS" | jq length)" \
              --output Logs/kill-set-base

      # The runner user reads what the docker steps wrote as root, but cannot write into it.
      - if: always()
        run: sudo chown -R "$(id -u):$(id -g)" Logs

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: Kill set base shard ${{ matrix.shard }}
          path: Logs/kill-set-base/mutant-*.json
          if-no-files-found: warn
          overwrite: true

  # ---------------------------------------------------------------------------
  # The comparison. Run only where every shard passed: a shard that failed on one tree leaves the mutants
  # it was dealt out of both, and the lists left would still agree.
  # ---------------------------------------------------------------------------
  diff:
    name: Kill set (diff)
    needs: [license-check, plan, shard]
    if: needs.shard.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.head }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: Kill set base shard *
          path: Logs/kill-set-base
          merge-multiple: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: Kill set head shard *
          path: Logs/kill-set-head
          merge-multiple: true

      - env:
          BASE: ${{ needs.plan.outputs.base }}
          HEAD: ${{ needs.plan.outputs.head }}
        run: |
          set +e
          python3 scripts/test_quality/kill_set_diff.py Logs/kill-set-base Logs/kill-set-head | tee diff.txt
          status=${PIPESTATUS[0]}
          { echo '### Kill set'; echo "base $BASE, head $HEAD"; echo '```'; cat diff.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
