name: Per-case coverage

# Records each case's line coverage on its own, over both suites, and reports for each fixture the lines
# no other fixture's cases reach. CONTRIBUTING.md ▸ Checking that the tests can fail owns when to run
# it and what a pull request says about the result.
#
# Dispatched by hand, never by an event, and no branch-protection rule requires it. It measures only when
# dispatched onto the default branch, with the commit to measure as `ref`: a run on any other branch sits
# on that branch's head, which settle.py waits on where it is a pull request's, so there the commit job
# resolves no commit and both suites skip.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "The branch or commit whose suites are measured"
        required: true
        default: main
      group:
        description: "Optional LABEL=REGEX: the tests whose Class::Method REGEX finds, reported as one unit"
        required: false

permissions:
  contents: read

# PYTHONDONTWRITEBYTECODE for the reason test.yml gives. EDITOR_MEMORY is the suite launch's memory and
# swap, which RunnerLimitTests holds as it holds every suite launch's.
env:
  PYTHONDONTWRITEBYTECODE: "1"
  EDITOR_MEMORY: "12g"

jobs:
  # Same reading as test.yml's job of this name.
  license-check:
    name: Check Unity license secret
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      has_license: ${{ steps.check.outputs.has_license }}
    steps:
      - id: check
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -n "$UNITY_LICENSE" ]; then
            echo "has_license=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_license=false" >> "$GITHUB_OUTPUT"
            echo "::notice::UNITY_LICENSE secret is not set — nothing is measured."
          fi

  # The commit both suites and the report read, so a branch that moves during the run does not split them.
  commit:
    name: Per-case coverage (commit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - id: sha
        env:
          DEFAULT_REF: refs/heads/${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_REF" = "$DEFAULT_REF" ]; then
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::dispatched onto $GITHUB_REF, so nothing is measured: dispatch onto $DEFAULT_REF and name the commit as ref"
          fi

  # ---------------------------------------------------------------------------
  # The suite in the editor image under scripts/ci/per_case_coverage.py, which gzips each case's file
  # as the package finishes it.
  # ---------------------------------------------------------------------------
  suite:
    name: Per-case coverage (${{ matrix.testMode }})
    needs: [license-check, commit]
    if: needs.license-check.outputs.has_license == 'true' && needs.commit.outputs.sha != ''
    runs-on: ubuntu-latest
    # Sized without a run to take a percentile of: the suite step has most of the job's bound, and the
    # rest is the checkout, the Library restore, the image pull and the uploads.
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        testMode: [EditMode, PlayMode]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.commit.outputs.sha }}
          lfs: true

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Library
          key: Library-${{ matrix.testMode }}-${{ hashFiles('Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.testMode }}-

      - name: Run ${{ matrix.testMode }} with each case's coverage on its own
        timeout-minutes: 270
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          PLATFORM: ${{ matrix.testMode }}
        run: |
          version=$(sed -n 's/^m_EditorVersion: //p' ProjectSettings/ProjectVersion.txt)
          docker run --rm --init --workdir /github/workspace \
            --memory "$EDITOR_MEMORY" --memory-swap "$EDITOR_MEMORY" --pids-limit 4096 \
            --volume "$GITHUB_WORKSPACE:/github/workspace" \
            --env UNITY_LICENSE --env UNITY_EMAIL --env UNITY_PASSWORD \
            --env PYTHONDONTWRITEBYTECODE=1 \
            "unityci/editor:ubuntu-$version-linux-il2cpp-3" \
            python3 -u scripts/ci/per_case_coverage.py --platform "$PLATFORM" --output Logs/per-case-coverage

      # The two readings test.yml's unity-tests job takes of its results, for the reasons it gives there.
      - name: Assert no inconclusive results
        if: always()
        run: python3 scripts/test_quality/assert_no_inconclusive.py Logs/per-case-coverage/results

      - name: Assert the results are this checkout's
        if: always()
        run: python3 scripts/test_quality/assert_results_from_this_tree.py Logs/per-case-coverage/results

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: Per-case coverage results (${{ matrix.testMode }})
          path: Logs/per-case-coverage/results

      # Already gzipped, one file a case, so the upload is asked for no compression of its own.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: Per-case coverage (${{ matrix.testMode }})
          path: Logs/per-case-coverage/per-case
          compression-level: 0
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Run only where both suites passed, so that what a deletion is read off is a suite that holds on the
  # commit measured.
  # ---------------------------------------------------------------------------
  report:
    name: Per-case coverage (report)
    needs: [commit, suite]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.commit.outputs.sha }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Per-case coverage (EditMode)
          path: Logs/per-case/EditMode

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Per-case coverage (PlayMode)
          path: Logs/per-case/PlayMode

      # The append to the summary stays on the line that bounds it: test_step_summary.py reads it by line.
      - env:
          SHA: ${{ needs.commit.outputs.sha }}
          GROUP: ${{ inputs.group }}
        run: |
          set +e
          python3 scripts/test_quality/unique_coverage.py Logs/per-case/EditMode Logs/per-case/PlayMode \
            ${GROUP:+--group "$GROUP"} > unique-coverage.txt 2>&1
          status=$?
          title="Lines only one fixture reaches ($SHA)"
          python3 scripts/ci/step_summary.py block "$title" unique-coverage.txt >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: Per-case coverage report
          path: unique-coverage.txt
